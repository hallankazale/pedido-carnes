ader class="page-head"><button class="back" data-go="home"><svg class="icon"><use href="#i-back"/></svg></button><h2>Produtos</h2><span></span></header><div id="productTabs" class="tabs"></div><input id="productSearch" class="input" placeholder="Buscar produto"><div id="productList"></div></section><section id="admin" class="screen"><header class="page-head"><button class="back" data-go="home"><svg class="icon"><use href="#i-back"/></svg></button><h2>Administrar</h2><span></span></header><div id="adminStats" class="admin-stats"></div><div class="tabs"><button class="tab active" data-admin="products">Produtos</button><button class="tab" data-admin="categories">Categorias</button><button class="tab" data-admin="backup">Backup</button></div><div id="adminProducts"><div class="form"><input id="editId" type="hidden"><label class="label">Produto</label><input id="adminName" class="input"><label class="label">Código interno</label><input id="adminCode" class="input"><label class="label">Categoria</label><select id="adminCategory"></select><label class="label">Formas de pedido</label><div id="adminModes" class="mode-grid"></div><label class="switch"><input id="adminActive" type="checkbox" checked> Produto ativo</label><label class="switch"><input id="adminFavorite" type="checkbox"> Favorito</label><div class="row" style="margin-top:10px"><button id="clearProduct" class="btn soft" style="flex:1">Limpar</button><button id="saveProduct" class="btn g" style="flex:1"><svg class="icon sm"><use href="#i-save"/></svg>Salvar</button></div></div><input id="adminSearch" class="input" placeholder="Buscar produto"><div id="adminProductList"></div></div><div id="adminCategories" style="display:none"><div class="form"><label class="label">Nova categoria</label><input id="newCategory" class="input"><button id="addCategory" class="btn g full"><svg class="icon sm"><use href="#i-plus"/></svg>Adicionar categoria</button></div><div id="categoryList"></div></div><div id="adminBackup" style="disp ass="orders-toolbar"><select id="statusFilter"><option value="">Todos</option><option>Rascunho</option><option>Enviado</option><option>Confirmado</option><option>Recebido</option><option>Cancelado</option></select><input id="ordersSearch" class="input" placeholder="Buscar" style="margin:0"></div><div id="ordersList"></div></section></main><nav class="nav"><button data-go="home" class="active"><svg class="icon"><use href="#i-home"/></svg>Início</button><button data-go="new-order"><svg class="icon"><use href="#i-plus"/></svg>Novo</button><button data-go="orders"><svg class="icon"><use href="#i-orders"/></svg>Pedidos</button><button data-go="suppliers"><svg class="icon"><use href="#i-users"/></svg>Fornec.</button><button data-go="admin"><svg class="icon"><use href="#i-settings"/></svg>Admin</button></nav><div id="toast" class="toast"></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],modes=['Caixa','Unidade','Carcaça','Inteiro','Peça'];const ico=(id,c='sm')=>`<svg class="icon ${c}"><use href="#i-${id}"/></svg>`;let categories=JSON.parse(localStorage.getItem('italia_categories')||'null')||['Bovinos','Suínos','Miúdos','Linguiças','Bacon','Frango'];const seed=[['Coxão mole','Bovinos',['Caixa']],['Contrafilé','Bovinos',['Caixa']],['Costela janela','Bovinos',['Unidade']],['Carcaça suína','Suínos',['Carcaça']],['Suíno inteiro','Suínos',['Inteiro']],['Fígado bovino','Miúdos',['Caixa']],['Coração bovino','Miúdos',['Caixa']],['Mocotó','Miúdos',['Caixa']],['Bucho','Miúdos',['Caixa']],['Calabresa','Linguiças',['Caixa']],['Toscana','Linguiças',['Caixa']],['Caseira','Linguiças',['Caixa']],['Apimentada','Linguiças',['Caixa']],['Bacon','Bacon',['Peça']],['Meio da asa','Frango',['Caixa']],['Coxinha da asa','Frango',['Caixa']],['Coração de frango','Frango',['Caixa']],['Coxa e sobrecoxa','Frango',['Caixa']]].map((x,i)=>({id:i+1,name:x[0],category:x[1],modes:x[2],code:'',active:true,favorite:false,order:i}));let products=JSON.parse(localStorage.get
