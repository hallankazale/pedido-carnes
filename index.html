<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#078f45">
<title>Itália Supermercado — Pedidos</title>
<style>
:root{--g:#078f45;--g2:#14ad59;--r:#cf3347;--ink:#172033;--muted:#697386;--line:#e7ece9;--bg:#f4f7f5;--card:#fff;--shadow:0 14px 34px rgba(23,32,51,.08);--shadow-sm:0 7px 20px rgba(23,32,51,.06)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% 0,#fff 0,#f9fbfa 32%,var(--bg) 68%)}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;padding:14px 16px calc(104px + env(safe-area-inset-bottom))}.screen{display:none;width:100%;animation:fade .18s ease}.screen.active{display:block}@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.brand{height:78px;display:flex;align-items:center;justify-content:center}.logo{width:100px;max-height:68px;object-fit:contain}.fallback{display:none;text-align:center}.fallback strong{display:block;color:#c93142;font-size:34px;line-height:1}.fallback span{display:block;color:#29984d;font-weight:900;font-size:10px;letter-spacing:3px;margin-top:4px}.hero{text-align:center;margin:2px 0 16px}.hero h1{font-size:26px;line-height:1.15;margin:0 0 5px;letter-spacing:-.5px}.hero p{max-width:310px;margin:auto;color:var(--muted);font-size:14px;line-height:1.45}
.primary{width:100%;min-height:84px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;grid-template-columns:50px 1fr 34px;align-items:center;gap:12px;padding:15px 16px;text-align:left;box-shadow:0 17px 34px rgba(7,143,69,.23);transition:.16s}.primary:active{transform:scale(.985)}.picon{width:50px;height:50px;border-radius:16px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:30px}.pcopy strong{display:block;font-size:20px;letter-spacing:-.25px}.pcopy span{display:block;font-size:12.5px;margin-top:3px;opacity:.9}.chev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.09);font-size:24px}.section-title{text-align:center;font-size:17px;margin:22px 0 11px;letter-spacing:-.15px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:20px;min-height:128px;padding:15px 12px;text-align:center;box-shadow:var(--shadow-sm);transition:.16s}.quick:active{transform:scale(.975)}.quick-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;margin:0 auto 11px}.quick strong{display:block;font-size:15.5px}.quick small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:5px}.green{background:#e9f8ef;color:var(--g)}.blue{background:#edf5ff;color:#3378bd}.purple{background:#f4edff;color:#7b58b6}.orange{background:#fff2e7;color:#c66b27}.quick svg,.nav svg,.empty-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card,.form,.item,.order-card{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow-sm)}.card{padding:17px;margin-top:18px}.card-title{text-align:center;font-size:17px;font-weight:800;margin-bottom:13px}.empty{border:1px dashed #cfe5d7;background:linear-gradient(145deg,#f3fbf6,#edf8f1);border-radius:17px;padding:22px 14px;text-align:center}.empty-icon{width:46px;height:46px;border-radius:15px;background:#fff;color:var(--g);display:grid;place-items:center;margin:0 auto 10px}.empty strong{display:block;font-size:14px}.empty small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}
.page-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:5px 0 17px}.page-head h2{text-align:center;margin:0;font-size:24px;letter-spacing:-.45px}.back{width:42px;height:42px;border:0;border-radius:14px;background:#e8f6ed;color:var(--g);font-size:21px;box-shadow:0 5px 14px rgba(7,143,69,.08)}.form{padding:16px;margin-bottom:15px}.field-label{display:block;font-size:12px;font-weight:800;color:#465165;margin:2px 2px 5px}.input,select,textarea{width:100%;border:1px solid #d8e0dc;border-radius:15px;padding:14px 15px;margin:0 0 11px;background:#fff;color:var(--ink);outline:none;transition:.15s}.input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(7,143,69,.11)}textarea{resize:vertical}.btn{border:0;border-radius:15px;min-height:50px;padding:14px 18px;font-weight:800;box-shadow:0 8px 18px rgba(23,32,51,.08);transition:.15s}.btn:active{transform:scale(.985)}.btn.full{width:100%}.btn.g{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.btn.r{background:linear-gradient(135deg,#ca3144,#df4053);color:#fff}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.item{padding:15px;margin:10px 0}.item strong{font-size:14.5px}.muted{color:var(--muted);font-size:12.5px;margin-top:4px}.del{border:0;background:#fff0f2;color:var(--r);border-radius:12px;padding:9px 11px;font-size:12px;font-weight:800}.checks{display:flex;justify-content:center;gap:20px;margin:2px 0 13px}.checks label{font-size:13px;font-weight:700}.category{text-align:center;font-size:17px;font-weight:850;margin:20px 0 9px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border-radius:13px;border:1px solid #d8e0dc;background:#fff;font-size:21px;box-shadow:0 4px 12px rgba(23,32,51,.05)}.qty strong{min-width:18px;text-align:center}.orders-list{display:grid;gap:11px}.order-card{padding:15px}.order-card .top{display:flex;justify-content:space-between;gap:10px}.order-card pre{margin:10px 0 0;color:#4e596b;font-size:12.5px;line-height:1.5;white-space:pre-wrap}.badge{background:#e8f7ee;color:var(--g);border-radius:999px;padding:6px 9px;font-size:10.5px;font-weight:850;height:max-content}.review-box pre{font-size:13px;line-height:1.55}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid rgba(220,228,223,.9);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -9px 28px rgba(23,32,51,.07);z-index:50}.nav button{border:0;background:none;color:#758092;border-radius:14px;padding:7px 2px;font-size:9.8px;min-height:52px}.nav svg{display:block;margin:0 auto 3px}.nav button.active{color:var(--g);font-weight:850;background:#eaf7ef}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;width:max-content;max-width:calc(100% - 36px);background:#172033;color:#fff;border-radius:13px;padding:11px 15px;display:none;z-index:80;box-shadow:var(--shadow)}pre{white-space:pre-wrap;font:inherit;line-height:1.5;margin:0}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen active">
<div class="brand"><img id="brandLogo" class="logo" src="https://play-lh.googleusercontent.com/jChxNWXw8WrCJ73jKiE1Z2UcR4lReT8I6ANKUU7-2xIQANwAX1zY6rzqLP8JfgUD4qNcbcmQeqXhZjfiUr0P" alt="Itália Supermercado" referrerpolicy="no-referrer"><div id="fallback" class="fallback"><strong>itália</strong><span>SUPERMERCADO</span></div></div>
<div class="hero"><h1>Olá! 👋</h1><p>Gerencie seus pedidos de carnes de forma rápida e organizada.</p></div>
<button class="primary" data-go="new-order"><span class="picon">＋</span><span class="pcopy"><strong>Novo pedido</strong><span>Criar um pedido de carnes</span></span><span class="chev">›</span></button>
<h3 class="section-title">Acesso rápido</h3>
<div class="quick-grid">
<button class="quick" data-go="products"><span class="quick-icon blue"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span><strong>Produtos</strong><small>Carnes, caixas e unidades</small></button>
<button class="quick" data-go="suppliers"><span class="quick-icon green"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg></span><strong>Fornecedores</strong><small>Contatos cadastrados</small></button>
<button class="quick" data-go="orders"><span class="quick-icon purple"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span><strong>Pedidos</strong><small>Histórico enviado</small></button>
<button class="quick" data-go="orders"><span class="quick-icon orange"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg></span><strong>Relatórios</strong><small>Resumo de pedidos</small></button>
</div>
<div class="card"><div class="card-title">Pedidos recentes</div><div id="recentOrders"></div></div>
</section>
<section id="suppliers" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2><span></span></div><div class="form"><label class="field-label">Nome</label><input id="supplierName" class="input" placeholder="Nome do fornecedor"><label class="field-label">WhatsApp</label><input id="supplierPhone" class="input" inputmode="tel" placeholder="DDD + número"><button id="saveSupplier" class="btn g full">Salvar fornecedor</button></div><div id="supplierList"></div></section>
<section id="products" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Produtos</h2><span></span></div><div class="form"><label class="field-label">Produto</label><input id="productName" class="input" placeholder="Nome da carne"><label class="field-label">Categoria</label><input id="productCategory" class="input" placeholder="Ex.: Caixaria"><div class="checks"><label><input id="allowBox" type="checkbox" checked> Caixa</label><label><input id="allowUnit" type="checkbox"> Unidade</label></div><button id="saveProduct" class="btn g full">Salvar produto</button></div><div id="productList"></div></section>
<section id="new-order" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Novo pedido</h2><span></span></div><div class="form"><label class="field-label">Fornecedor</label><select id="supplierSelect"></select></div><div id="orderProducts"></div><button id="reviewOrder" class="btn g full">Revisar pedido</button></section>
<section id="review" class="screen"><div class="page-head"><button class="back" data-go="new-order">←</button><h2>Revisar pedido</h2><span></span></div><div class="form"><label class="field-label">Responsável</label><input id="responsible" class="input" placeholder="Nome do responsável"><label class="field-label">Observação</label><textarea id="notes" rows="3" placeholder="Informação adicional"></textarea></div><div class="form review-box"><pre id="summaryText"></pre></div><button id="openWhatsapp" class="btn r full">Abrir no WhatsApp</button></section>
<section id="orders" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Pedidos</h2><span></span></div><div id="ordersList" class="orders-list"></div></section>
</main>
<nav class="nav">
<button data-go="home" class="active"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>Início</button>
<button data-go="new-order"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Novo pedido</button>
<button data-go="orders"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>Pedidos</button>
<button data-go="suppliers"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Fornecedores</button>
<button data-go="products"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>Produtos</button>
</nav>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const logo=$('#brandLogo'),fallback=$('#fallback');logo.onerror=()=>{logo.style.display='none';fallback.style.display='block'};
const seedSuppliers=[{id:1,name:'Hallan',phone:'66996022643'}];
const seedProducts=[{id:1,name:'Coxão mole',category:'Caixaria',box:true,unit:false},{id:2,name:'Contrafilé',category:'Caixaria',box:true,unit:true},{id:3,name:'Costela janela',category:'Costelas',box:false,unit:true}];
let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||seedSuppliers;
let products=JSON.parse(localStorage.getItem('italia_products')||'null')||seedProducts;
let orders=JSON.parse(localStorage.getItem('italia_orders')||'[]');
let order={};
function persist(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products',JSON.stringify(products));localStorage.setItem('italia_orders',JSON.stringify(orders))}
function toast(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',1900)}
function emptyState(title,desc){return `<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div><strong>${title}</strong><small>${desc}</small></div>`}
function go(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='home')renderRecent();if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();if(id==='orders')renderOrders();scrollTo({top:0,behavior:'smooth'})}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function renderRecent(){const el=$('#recentOrders');if(!orders.length){el.innerHTML=emptyState('Nenhum pedido ainda','Crie seu primeiro pedido tocando em “Novo pedido”.');return}const last=orders[0];el.innerHTML=`<div class="order-card"><div class="top"><div><strong>${last.supplier}</strong><div class="muted">${last.date}</div></div><span class="badge">Enviado</span></div></div>`}
function renderSuppliers(){const el=$('#supplierList');el.innerHTML=suppliers.length?'':emptyState('Nenhum fornecedor','Cadastre um contato para começar.');suppliers.forEach(s=>{el.insertAdjacentHTML('beforeend',`<div class="item"><div class="row between"><div><strong>${s.name}</strong><div class="muted">${s.phone}</div></div><button class="del" data-del-supplier="${s.id}">Excluir</button></div></div>`) });el.querySelectorAll('[data-del-supplier]').forEach(b=>b.onclick=()=>{suppliers=suppliers.filter(s=>s.id!=b.dataset.delSupplier);persist();renderSuppliers()})}
function renderProducts(){const el=$('#productList');el.innerHTML=products.length?'':emptyState('Nenhum produto','Cadastre uma carne para começar.');products.forEach(p=>{el.insertAdjacentHTML('beforeend',`<div class="item"><div class="row between"><div><strong>${p.name}</strong><div class="muted">${p.category} · ${[p.box?'Caixa':'',p.unit?'Unidade':''].filter(Boolean).join(' e ')}</div></div><button class="del" data-del-product="${p.id}">Excluir</button></div></div>`) });el.querySelectorAll('[data-del-product]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!=b.dataset.delProduct);persist();renderProducts()})}
$('#saveSupplier').onclick=()=>{const name=$('#supplierName').value.trim(),phone=$('#supplierPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válidos');suppliers.push({id:Date.now(),name,phone});persist();$('#supplierName').value='';$('#supplierPhone').value='';renderSuppliers();toast('Fornecedor salvo')};
$('#saveProduct').onclick=()=>{const name=$('#productName').value.trim(),category=$('#productCategory').value.trim(),box=$('#allowBox').checked,unit=$('#allowUnit').checked;if(name.length<2||category.length<2||(!box&&!unit))return toast('Preencha os dados corretamente');products.push({id:Date.now(),name,category,box,unit});persist();$('#productName').value='';$('#productCategory').value='';renderProducts();toast('Produto salvo')};
function qty(id,type,label){return `<div class="row between" style="margin-top:12px"><span class="muted">${label}</span><div class="qty"><button data-q="${id}:${type}:-1">−</button><strong>${order[id][type]}</strong><button data-q="${id}:${type}:1">+</button></div></div>`}
function renderOrder(){const sel=$('#supplierSelect');sel.innerHTML=suppliers.length?suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''):'<option value="">Nenhum fornecedor cadastrado</option>';const wrap=$('#orderProducts');wrap.innerHTML='';const groups={};products.forEach(p=>(groups[p.category]??=[]).push(p));Object.entries(groups).forEach(([cat,items])=>{wrap.insertAdjacentHTML('beforeend',`<div class="category">${cat}</div>`);items.forEach(p=>{order[p.id]??={box:0,unit:0};wrap.insertAdjacentHTML('beforeend',`<div class="item"><strong>${p.name}</strong>${p.box?qty(p.id,'box','Caixas'):''}${p.unit?qty(p.id,'unit','Unidades'):''}</div>`)})});wrap.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,type,delta]=b.dataset.q.split(':');order[id][type]=Math.max(0,Math.min(999,order[id][type]+Number(delta)));renderOrder()})}
$('#reviewOrder').onclick=()=>{if(!suppliers.length)return toast('Cadastre um fornecedor');if(!Object.values(order).some(v=>v.box||v.unit))return toast('Adicione ao menos um item');go('review')};
function build(){const supplier=suppliers.find(s=>String(s.id)===$('#supplierSelect').value)||suppliers[0];const lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${supplier?.name||''}`,''];const groups={};products.forEach(p=>{const q=order[p.id];if(q&&(q.box||q.unit))(groups[p.category]??=[]).push({p,q})});Object.entries(groups).forEach(([cat,items])=>{lines.push(`*${cat.toUpperCase()}*`);items.forEach(({p,q})=>{const vals=[];if(q.box)vals.push(`${q.box} caixa(s)`);if(q.unit)vals.push(`${q.unit} unidade(s)`);lines.push(`• ${p.name}: ${vals.join(' e ')}`)});lines.push('')});const responsible=$('#responsible').value.trim(),notes=$('#notes').value.trim();if(responsible)lines.push(`Responsável: ${responsible}`);if(notes)lines.push(`Observação: ${notes}`);return{text:lines.join('\n'),supplier}}
function renderReview(){$('#summaryText').textContent=build().text}
$('#openWhatsapp').onclick=()=>{const data=build();const phone=data.supplier?.phone?.replace(/\D/g,'');if(!phone)return toast('Fornecedor sem WhatsApp válido');orders.unshift({id:Date.now(),supplier:data.supplier.name,date:new Date().toLocaleString('pt-BR'),text:data.text});orders=orders.slice(0,100);persist();window.open(`https://wa.me/55${phone}?text=${encodeURIComponent(data.text)}`,'_blank');renderRecent()};
function renderOrders(){const el=$('#ordersList');if(!orders.length){el.innerHTML=emptyState('Nenhum pedido enviado','Os pedidos enviados pelo WhatsApp aparecerão aqui.');return}el.innerHTML=orders.map(o=>`<article class="order-card"><div class="top"><div><strong>${o.supplier}</strong><div class="muted">${o.date}</div></div><span class="badge">Enviado</span></div><pre>${o.text}</pre></article>`).join('')}
renderRecent();
</script>
</body>
</html>
