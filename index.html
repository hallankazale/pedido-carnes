<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos de Carnes — Itália Supermercado</title>
<style>
:root{--green:#008b68;--red:#df1f2d;--bg:#f4f7f5;--card:#fff;--text:#17211d;--muted:#64706a;--line:#dce5e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}main{max-width:760px;margin:auto;padding:18px}.header{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:16px}.logo{display:block;width:min(100%,420px);height:auto;margin:auto}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.btn{width:100%;min-height:54px;border:0;border-radius:15px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.grid{display:grid;gap:12px}.two{grid-template-columns:1fr 1fr}.input,select,textarea{width:100%;border:1px solid #cfdad4;background:#fff;border-radius:14px;padding:14px;font-size:16px;margin:6px 0 10px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border:1px solid #cfdad4;border-radius:12px;background:#fff;font-size:22px}.back{border:0;background:transparent;color:var(--green);font-weight:800;font-size:16px;padding:0}.muted{color:var(--muted);font-size:14px}.section{font-size:20px;font-weight:900;margin:20px 0 8px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e5f4ef;color:var(--green);font-size:12px;font-weight:800}.summary pre{white-space:pre-wrap;font:inherit;line-height:1.55}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17211d;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:10}@media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header class="header"><img class="logo" src="assets/italia-logo.svg" alt="Itália Supermercado"><p class="subtitle">Pedidos de carnes rápidos e organizados</p></header>
<section id="home" class="screen active"><div class="card"><span class="badge">PROTÓTIPO FUNCIONAL</span><h2>Monte o pedido em poucos toques</h2><p class="muted">Cadastre fornecedores e produtos, escolha as quantidades e envie pelo WhatsApp.</p><button class="btn primary" data-go="new-order">+ Novo pedido</button></div><div class="grid two"><button class="btn secondary" data-go="suppliers">Fornecedores</button><button class="btn secondary" data-go="products">Produtos</button></div><div class="card"><strong id="stats"></strong><p class="muted">Os dados ficam salvos neste navegador.</p></div></section>
<section id="suppliers" class="screen"><button class="back" data-go="home">← Voltar</button><h2>Fornecedores</h2><div class="card"><input id="supplierName" class="input" placeholder="Nome do fornecedor"><input id="supplierPhone" class="input" inputmode="tel" placeholder="WhatsApp com DDD"><button id="saveSupplier" class="btn primary">Salvar fornecedor</button></div><div id="supplierList"></div></section>
<section id="products" class="screen"><button class="back" data-go="home">← Voltar</button><h2>Produtos</h2><div class="card"><input id="productName" class="input" placeholder="Nome da carne"><input id="productCategory" class="input" placeholder="Categoria, ex.: Caixaria"><div class="row"><label><input id="allowBox" type="checkbox" checked> Caixa</label><label><input id="allowUnit" type="checkbox"> Unidade</label></div><button id="saveProduct" class="btn primary" style="margin-top:12px">Salvar produto</button></div><div id="productList"></div></section>
<section id="new-order" class="screen"><button class="back" data-go="home">← Voltar</button><h2>Novo pedido</h2><div class="card"><label>Fornecedor</label><select id="supplierSelect"></select></div><div id="orderProducts"></div><button id="reviewOrder" class="btn primary">Revisar pedido</button></section>
<section id="review" class="screen"><button class="back" data-go="new-order">← Voltar</button><h2>Revisar pedido</h2><div class="card"><input id="responsible" class="input" placeholder="Nome do responsável"><textarea id="notes" rows="3" placeholder="Observação"></textarea></div><div class="card summary"><pre id="summaryText"></pre></div><button id="openWhatsapp" class="btn danger">Abrir no WhatsApp</button></section>
</main><div id="toast" class="toast"></div>
<script>
const defaultSupplier={id:1,name:'Hallan',phone:'66996022643'};
const seedProducts=[{id:1,name:'Coxão mole',category:'Caixaria',box:true,unit:false},{id:2,name:'Contrafilé',category:'Caixaria',box:true,unit:true},{id:3,name:'Costela janela',category:'Costelas',box:false,unit:true}];
let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||[defaultSupplier];let products=JSON.parse(localStorage.getItem('italia_products')||'null')||seedProducts;let order={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products',JSON.stringify(products))}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function go(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');if(id==='home')home();if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();scrollTo(0,0)}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function home(){$('#stats').textContent=`${suppliers.length} fornecedor(es) · ${products.length} produto(s)`}
function renderSuppliers(){const e=$('#supplierList');e.innerHTML='';suppliers.forEach(s=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="row between"><div><strong>${s.name}</strong><div class="muted">${s.phone}</div></div><button class="back" data-del="${s.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{suppliers=suppliers.filter(s=>s.id!=b.dataset.del);save();renderSuppliers()})}
function renderProducts(){const e=$('#productList');e.innerHTML='';products.forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="row between"><div><strong>${p.name}</strong><div class="muted">${p.category} · ${[p.box?'Caixa':'',p.unit?'Unidade':''].filter(Boolean).join(' e ')}</div></div><button class="back" data-del="${p.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!=b.dataset.del);save();renderProducts()})}
$('#saveSupplier').onclick=()=>{const name=$('#supplierName').value.trim(),phone=$('#supplierPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válido');suppliers.push({id:Date.now(),name,phone});save();$('#supplierName').value='';$('#supplierPhone').value='';renderSuppliers();toast('Fornecedor salvo')};
$('#saveProduct').onclick=()=>{const name=$('#productName').value.trim(),category=$('#productCategory').value.trim(),box=$('#allowBox').checked,unit=$('#allowUnit').checked;if(name.length<2||category.length<2||(!box&&!unit))return toast('Preencha os dados corretamente');products.push({id:Date.now(),name,category,box,unit});save();$('#productName').value='';renderProducts();toast('Produto salvo')};
function qty(id,type,label){return `<div class="row between" style="margin-top:12px"><span class="muted">${label}</span><div class="qty"><button data-q="${id}:${type}:-1">−</button><strong>${order[id][type]}</strong><button data-q="${id}:${type}:1">+</button></div></div>`}
function renderOrder(){const s=$('#supplierSelect');s.innerHTML=suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');const w=$('#orderProducts');w.innerHTML='';const groups={};products.forEach(p=>(groups[p.category]??=[]).push(p));Object.entries(groups).forEach(([cat,items])=>{w.insertAdjacentHTML('beforeend',`<div class="section">${cat}</div>`);items.forEach(p=>{order[p.id]??={box:0,unit:0};w.insertAdjacentHTML('beforeend',`<div class="card"><strong>${p.name}</strong>${p.box?qty(p.id,'box','caixas'):''}${p.unit?qty(p.id,'unit','unidades'):''}</div>`)})});w.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,t,d]=b.dataset.q.split(':');order[id][t]=Math.max(0,Math.min(999,order[id][t]+Number(d)));renderOrder()})}
$('#reviewOrder').onclick=()=>Object.values(order).some(v=>v.box||v.unit)?go('review'):toast('Adicione ao menos um item');
function build(){const supplier=suppliers.find(s=>String(s.id)===$('#supplierSelect').value)||suppliers[0];const lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${supplier?.name||''}`,''];const groups={};products.forEach(p=>{const q=order[p.id];if(q&&(q.box||q.unit))(groups[p.category]??=[]).push({p,q})});Object.entries(groups).forEach(([c,it])=>{lines.push(`*${c.toUpperCase()}*`);it.forEach(({p,q})=>{if(q.box)lines.push(`• ${q.box} caixa${q.box>1?'s':''} de ${p.name}`);if(q.unit)lines.push(`• ${q.unit} unidade${q.unit>1?'s':''} de ${p.name}`)});lines.push('')});const n=$('#notes').value.trim(),r=$('#responsible').value.trim();if(n)lines.push('Observação:',n,'');if(r)lines.push(`Responsável: ${r}`);return{supplier,text:lines.join('\n')}}function renderReview(){$('#summaryText').textContent=build().text}$('#responsible').oninput=renderReview;$('#notes').oninput=renderReview;$('#openWhatsapp').onclick=()=>{const{supplier,text}=build();const p=supplier.phone.startsWith('55')?supplier.phone:'55'+supplier.phone;open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank')};home();
</script></body></html>
