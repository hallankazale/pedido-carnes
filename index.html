<style>

eg,var(--g),var(--g2));color:#fff}.btn.r{background:linear-gradient(135deg,#ca3144,#df4053);color:#fff}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.item{padding:14px;margin:10px 0}.item strong{font-size:14.5px}.muted{color:var(--muted);font-size:12.5px;margin-top:4px}.del{border:0;background:#fff0f2;color:var(--r);border-radius:11px;padding:8px 10px;font-size:11.5px;font-weight:800}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;margin:0 -1px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#596579;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;white-space:nowrap}.tab.active{border-color:var(--g);background:#e9f8ef;color:var(--g);box-shadow:0 4px 12px rgba(7,143,69,.1)}.search-wrap{position:relative;margin-bottom:11px}.search-wrap .input{padding-left:40px;margin:0}.search-icon{position:absolute;left:14px;top:13px;color:#8792a2;font-size:17px}.product-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.product-card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.product-name{font-size:15px;font-weight:850}.mode-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#f1f5f3;color:#586476;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:750}.category-count{font-size:11px;color:var(--muted);text-align:center;margin:-2px 0 10px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:3px 0 12px}.mode-grid label{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-weight:750;background:#fafcfb}.order-toolbar{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 82%,rgba(244,247,245,0));padding-top:2px}.qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.qty-label{font-size:12px;color:var(--muted);font-weight:700}.qty{display:flex;align-items:center;gap:10px}.qty button{width:40px;height:40px;border-radius:13px;border:1px solid #d8e0dc;background:#fff;font-size:21px}.qty strong{min-width:20px;text-align:center}.selected-summary{background:#172033;color:#fff;border-radius:17px;padding:12px 14px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px}.selected-summary strong{font-size:16px}.orders-list{display:grid;gap:11px}.order-card{padding:14px}.order-card .top{display:flex;justify-content:space-between;gap:10px}.order-card pre{margin:9px 0 0;color:#4e596b;font-size:12.2px;line-height:1.5;white-space:pre-wrap}.badge{background:#e8f7ee;color:var(--g);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:850;height:max-content}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -9px 28px rgba(23,32,51,.07);z-index:50}.nav button{border:0;background:none;color:#758092;border-radius:14px;padding:7px 2px;font-size:9.7px;min-height:52px}.nav svg{display:block;margin:0 auto 3px}.nav button.active{color:var(--g);font-weight:850;background:#eaf7ef}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;max-width:calc(100% - 36px);background:#172033;color:#fff;border-radius:13px;padding:11px 15px;display:none;z-index:80}pre{white-space:pre-wrap;font:inherit;line-height:1.5;margin:0}
</style>

<main class="app">
<section id="home" class="screen active"><div class="brand"><img id="brandLogo" class="logo" src="https://play-lh.googleusercontent.com/jChxNWXw8WrCJ73jKiE1Z2UcR4lReT8I6ANKUU7-2xIQANwAX1zY6rzqLP8JfgUD4qNcbcmQeqXhZjfiUr0P" alt="Itália Supermercado" referrerpolicy="no-referrer"><div id="fallback" class="fallback"><strong>itália</strong><span>SUPERMERCADO</span></div></div><div class="hero"><h1>Olá! 👋</h1><p>Gerencie os pedidos por categoria, sem poluir a tela.</p></div><button class="primary" data-go="new-order"><span class="picon">＋</span><span class="pcopy"><strong>Novo pedido</strong><span>Escolher produtos por abas</span></span><span class="chev">›</span></button><h3 class="section-title">Acesso rápido</h3><div class="quick-grid"><button class="quick" data-go="products"><span class="quick-icon blue"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span><strong>Produtos</strong><small>Organizados por abas</small></button><button class="quick" data-go="suppliers"><span class="quick-icon green"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><strong>Fornecedores</strong><small>Contatos cadastrados</small></button><button class="quick" data-go="orders"><span class="quick-icon purple"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span><strong>Pedidos</strong><small>Histórico enviado</small></button><button class="quick" data-go="orders"><span class="quick-icon orange"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg></span><strong>Relatórios</strong><small>Resumo de pedidos</small></button></div><div class="card"><div class="card-title">Pedidos recentes</div><div id="recentOrders"></div></div></section>
<section id="suppliers" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2><span></span></div><div class="form"><label class="field-label">Nome</label><input id="supplierName" class="input" placeholder="Nome do fornecedor"><label class="field-label">WhatsApp</label><input id="supplierPhone" class="input" inputmode="tel" placeholder="DDD + número"><button id="saveSupplier" class="btn g full">Salvar fornecedor</button></div><div id="supplierList"></div></section>

<section id="new-order" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Novo pedido</h2><span></span></div><div class="form"><label class="field-label">Fornecedor</label><select id="supplierSelect"></select></div><div class="order-toolbar"><div class="tabs" id="orderTabs"></div><div class="search-wrap"><span class="search-icon">⌕</span><input id="orderSearch" class="input" placeholder="Buscar produto"></div></div><div id="orderProducts"></div><div id="selectedSummary" class="selected-summary"><span>Itens selecionados</span><strong>0</strong></div><button id="reviewOrder" class="btn g full">Revisar pedido</button></section>
<section id="review" class="screen"><div class="page-head"><button class="back" data-go="new-order">←</button><h2>Revisar pedido</h2><span></span></div><div class="form"><label class="field-label">Responsável</label><input id="responsible" class="input" placeholder="Nome do responsável"><label class="field-label">Observação</label><textarea id="notes" rows="3" placeholder="Informação adicional"></textarea></div><div class="form"><pre id="summaryText"></pre></div><button id="openWhatsapp" class="btn r full">Abrir no WhatsApp</button></section>
<section id="orders" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Pedidos</h2><span></span></div><div id="ordersList" class="orders-list"></div></section>
</main>
<nav class="nav"><button data-go="home" class="active"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Início</button><button data-go="new-order"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Novo pedido</button><button data-go="orders"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>Pedidos</button><button data-go="suppliers"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Fornecedores</button><button data-go="products"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Produtos</button></nav><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const categories=['Bovinos','Suínos','Miúdos','Linguiças','Bacon','Frango'];const modes={box:'Caixa',unit:'Unidade',carcass:'Carcaça',whole:'Inteiro',piece:'Peça'};const seedProducts=[
{id:1,name:'Coxão mole',category:'Bovinos',modes:['box']},{id:2,name:'Contrafilé',category:'Bovinos',modes:['box']},{id:3,name:'Alcatra',category:'Bovinos',modes:['box']},{id:4,name:'Patinho',category:'Bovinos',modes:['box']},{id:5,name:'Acém',category:'Bovinos',modes:['box']},{id:6,name:'Costela bovina',category:'Bovinos',modes:['unit']},
{id:20,name:'Carcaça suína',category:'Suínos',modes:['carcass']},{id:21,name:'Pernil suíno',category:'Suínos',modes:['whole']},{id:22,name:'Paleta suína',category:'Suínos',modes:['whole']},{id:23,name:'Costela suína',category:'Suínos',modes:['whole']},
{id:30,name:'Fígado bovino',category:'Miúdos',modes:['box']},{id:31,name:'Coração bovino',category:'Miúdos',modes:['box']},{id:32,name:'Mocotó',category:'Miúdos',modes:['box']},{id:33,name:'Bucho bovino',category:'Miúdos',modes:['box']},
{id:40,name:'Linguiça calabresa',category:'Linguiças',modes:['box']},{id:41,name:'Linguiça toscana',category:'Linguiças',modes:['box']},{id:42,name:'Linguiça caseira',category:'Linguiças',modes:['box']},{id:43,name:'Linguiça apimentada',category:'Linguiças',modes:['box']},
{id:50,name:'Bacon',category:'Bacon',modes:['piece']},
{id:60,name:'Meio da asa',category:'Frango',modes:['box']},{id:61,name:'Coxinha da asa',category:'Frango',modes:['box']},{id:62,name:'Coração de frango',category:'Frango',modes:['box']},{id:63,name:'Coxa e sobrecoxa',category:'Frango',modes:['box']}
];const seedSuppliers=[{id:1,name:'Hallan',phone:'66996022643'}];let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||seedSuppliers;let stored=JSON.parse(localStorage.getItem('italia_products_v2')||'null');let products=stored||seedProducts;let orders=JSON.parse(localStorage.getItem('italia_orders')||'[]');let order={};let productTab='Bovinos',orderTab='Bovinos';
const logo=$('#brandLogo'),fallback=$('#fallback');logo.onerror=()=>{logo.style.display='none';fallback.style.display='block'};function persist(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products_v2',JSON.stringify(products));localStorage.setItem('italia_orders',JSON.stringify(orders))}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function go(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();if(id==='orders')renderOrders();if(id==='home')renderRecent();scrollTo(0,0)}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function tabs(el,active,onClick){el.innerHTML=categories.map(c=>`<button class="tab ${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('');el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>onClick(b.dataset.cat))}
function renderSuppliers(){const e=$('#supplierList');e.innerHTML=suppliers.length?'':'<div class="empty"><strong>Nenhum fornecedor</strong><small>Cadastre o primeiro contato.</small></div>';suppliers.forEach(s=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row between"><div><strong>${s.name}</strong><div class="muted">${s.phone}</div></div><button class="del" data-del="${s.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{suppliers=suppliers.filter(s=>s.id!=b.dataset.del);persist();renderSuppliers()})}
$('#saveSupplier').onclick=()=>{const name=$('#supplierName').value.trim(),phone=$('#supplierPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válido');suppliers.push({id:Date.now(),name,phone});persist();$('#supplierName').value='';$('#supplierPhone').value='';renderSuppliers();toast('Fornecedor salvo')};
function renderProducts(){tabs($('#productTabs'),productTab,c=>{productTab=c;renderProducts()});$('#productCategory').innerHTML=categories.map(c=>`<option ${c===productTab?'selected':''}>${c}</option>`).join('');$('#modeOptions').innerHTML=Object.entries(modes).map(([k,v])=>`<label><input type="checkbox" value="${k}" ${k==='box'?'checked':''}> ${v}</label>`).join('');const q=$('#productSearch').value.trim().toLowerCase();const list=products.filter(p=>p.category===productTab&&p.name.toLowerCase().includes(q));$('#categoryCount').textContent=`${list.length} produto${list.length===1?'':'s'} em ${productTab}`;const e=$('#productList');e.innerHTML=list.length?'':'<div class="empty"><strong>Nenhum produto nesta aba</strong><small>Use o formulário abaixo para cadastrar.</small></div>';list.forEach(p=>{const d=document.createElement('div');d.className='product-card';d.innerHTML=`<div class="top"><div><div class="product-name">${p.name}</div><div class="mode-chips">${p.modes.map(m=>`<span class="chip">${modes[m]}</span>`).join('')}</div></div><button class="del" data-del="${p.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!=b.dataset.del);persist();renderProducts()})}
$('#productSearch').oninput=renderProducts;$('#saveProduct').onclick=()=>{const name=$('#productName').value.trim(),category=$('#productCategory').value,selected=[...$('#modeOptions').querySelectorAll('input:checked')].map(i=>i.value);if(name.length<2||!selected.length)return toast('Informe o produto e ao menos uma forma');products.push({id:Date.now(),name,category,modes:selected});persist();productTab=category;$('#productName').value='';renderProducts();toast('Produto salvo')};
function qtyRow(p,m){order[p.id]??={};order[p.id][m]??=0;return `<div class="qty-row"><span class="qty-label">${modes[m]}</span><div class="qty"><button data-q="${p.id}:${m}:-1">−</button><strong>${order[p.id][m]}</strong><button data-q="${p.id}:${m}:1">+</button></div></div>`}
function renderOrder(){tabs($('#orderTabs'),orderTab,c=>{orderTab=c;renderOrder()});$('#supplierSelect').innerHTML=suppliers.length?suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''):'<option>Nenhum fornecedor</option>';const q=$('#orderSearch').value.trim().toLowerCase();const list=products.filter(p=>p.category===orderTab&&p.name.toLowerCase().includes(q));const e=$('#orderProducts');e.innerHTML=list.length?'':'<div class="empty"><strong>Nenhum produto encontrado</strong><small>Tente outra busca ou categoria.</small></div>';list.forEach(p=>{const d=document.createElement('div');d.className='product-card';d.innerHTML=`<div class="product-name">${p.name}</div>${p.modes.map(m=>qtyRow(p,m)).join('')}`;e.appendChild(d)});e.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,m,d]=b.dataset.q.split(':');order[id]??={};order[id][m]=Math.max(0,Math.min(999,(order[id][m]||0)+Number(d)));renderOrder()});const total=Object.values(order).reduce((sum,obj)=>sum+Object.values(obj).reduce((a,b)=>a+b,0),0);$('#selectedSummary').querySelector('strong').textContent=total}
$('#orderSearch').oninput=renderOrder;$('#reviewOrder').onclick=()=>Object.values(order).some(o=>Object.values(o).some(v=>v>0))?go('review'):toast('Adicione ao menos um item');
function build(){const supplier=suppliers.find(s=>String(s.id)===$('#supplierSelect').value)||suppliers[0];const lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${supplier?.name||''}`,''];categories.forEach(cat=>{const items=products.filter(p=>p.category===cat).filter(p=>{const q=order[p.id];return q&&Object.values(q).some(v=>v>0)});if(!items.length)return;lines.push(`*${cat.toUpperCase()}*`);items.forEach(p=>{const parts=Object.entries(order[p.id]).filter(([,v])=>v>0).map(([m,v])=>`${v} ${modes[m].toLowerCase()}(s)`);lines.push(`• ${p.name}: ${parts.join(' e ')}`)});lines.push('')});const r=$('#responsible').value.trim(),n=$('#notes').value.trim();if(r)lines.push(`Responsável: ${r}`);if(n)lines.push(`Observação: ${n}`);return{text:lines.join('\n'),supplier}}
function renderReview(){$('#summaryText').textContent=build().text}$('#openWhatsapp').onclick=()=>{const b=build();if(!b.supplier)return toast('Cadastre um fornecedor');orders.unshift({id:Date.now(),date:new Date().toLocaleString('pt-BR'),supplier:b.supplier.name,text:b.text});orders=orders.slice(0,50);persist();window.open(`https://wa.me/55${b.supplier.phone}?text=${encodeURIComponent(b.text)}`,'_blank');order={};renderRecent()};
function renderOrders(){const e=$('#ordersList');e.innerHTML=orders.length?'':'<div class="empty"><strong>Nenhum pedido salvo</strong><small>Os pedidos enviados aparecerão aqui.</small></div>';orders.forEach(o=>{const d=document.createElement('div');d.className='order-card';d.innerHTML=`<div class="top"><div><strong>${o.supplier}</strong><div class="muted">${o.date}</div></div><span class="badge">Enviado</span></div><pre>${o.text}</pre>`;e.appendChild(d)})}function renderRecent(){const e=$('#recentOrders');if(!orders.length){e.innerHTML='<div class="empty"><strong>Nenhum pedido ainda</strong><small>Crie seu primeiro pedido.</small></div>';return}const o=orders[0];e.innerHTML=`<div class="order-card"><div class="top"><div><strong>${o.supplier}</strong><div class="muted">${o.date}</div></div><span class="badge">Último</span></div></div>`}
renderRecent();
</script>
</body></html>
