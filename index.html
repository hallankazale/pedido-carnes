<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0aa04f"><title>Itália Supermercado — Pedidos</title><style>:root{--g:#0aa04f;--g2:#12b65d;--r:#d83246;--t:#172033;--m:#667085;--l:#e7ecef;--bg:#f6f8fa;--s:0 10px 26px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:linear-gradient(#fff 0 260px,var(--bg) 520px);padding:14px 16px calc(98px + env(safe-area-inset-bottom))}.screen{display:none;width:100%;margin:0 auto}.screen.active{display:block}.brand{display:flex;justify-content:center;align-items:center;height:92px}.logo{width:108px;max-height:78px;object-fit:contain}.fallback{display:none;text-align:center}.fallback strong{display:block;color:#c93142;font-size:36px}.fallback span{display:block;color:#29984d;font-weight:900;font-size:11px;letter-spacing:4px}.hero{text-align:center;margin-bottom:16px}.hero h1{font-size:26px;margin:0 0 5px}.hero p{margin:0 auto;max-width:310px;color:var(--m);font-size:14px;line-height:1.4}.primary{width:100%;min-height:86px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;grid-template-columns:52px 1fr 34px;gap:12px;align-items:center;padding:15px;box-shadow:0 14px 26px rgba(10,160,79,.22);text-align:left}.picon{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:31px;font-weight:400}.pcopy strong{display:block;font-size:20px;margin-bottom:3px}.pcopy span{font-size:13px}.chev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.08);font-size:24px}.title{text-align:center;font-size:18px;margin:22px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick{min-height:132px;border:1px solid var(--l);background:#fff;border-radius:18px;padding:15px;text-align:center;box-shadow:var(--s)}.quick .icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin:0 auto 12px}.quick strong{display:block;font-size:16px}.quick small{display:block;color:var(--m);font-size:12px;line-height:1.35;margin-top:5px}.green{background:#eaf9f0}.blue{background:#edf5ff}.purple{background:#f4ecff}.orange{background:#fff2e8}.icon svg,.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.panel,.form,.item{background:#fff;border:1px solid var(--l);border-radius:20px;box-shadow:var(--s)}.panel{padding:16px;margin:18px auto 0}.panel-title{text-align:center;font-size:18px;font-weight:800;margin-bottom:12px}.empty{text-align:center;background:#eef9f2;border-radius:15px;padding:21px 14px;font-weight:750}.empty small{display:block;color:var(--m);font-weight:400;margin-top:5px}.head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:3px 0 17px}.head h2{text-align:center;margin:0;font-size:25px}.back{width:42px;height:42px;border:0;border-radius:13px;background:#eaf7ef;color:var(--g);font-size:22px}.form{padding:16px;margin:0 auto 15px}.input,select,textarea{width:100%;border:1px solid #d6dee3;border-radius:14px;padding:14px 15px;margin:5px 0 11px;background:#fff;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(10,160,79,.12)}.btn{border:0;border-radius:14px;min-height:50px;padding:14px 18px;font-weight:800}.btn.full{width:100%}.btn.g{background:var(--g);color:#fff}.btn.r{background:var(--r);color:#fff}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.item{padding:15px;margin:10px auto}.muted{color:var(--m);font-size:13px;margin-top:3px}.del{border:0;background:#fff0f2;color:var(--r);border-radius:11px;padding:9px 11px;font-weight:700}.checks{display:flex;justify-content:center;gap:22px;margin:4px 0 13px}.category{text-align:center;font-size:18px;font-weight:800;margin:20px 0 9px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border-radius:13px;border:1px solid #d6dee3;background:#fff;font-size:22px}.orders-list{display:grid;gap:11px}.order-card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:15px;box-shadow:var(--s)}.order-card .top{display:flex;justify-content:space-between;gap:10px}.order-card pre{margin:10px 0 0;color:#475467;font-size:13px;white-space:pre-wrap}.badge{background:#eaf9f0;color:var(--g);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;height:max-content}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.98);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 22px rgba(16,24,40,.06);z-index:50}.nav button{border:0;background:none;color:#667085;border-radius:13px;padding:7px 2px;font-size:10px}.nav svg{display:block;margin:0 auto 3px}.nav button.active{color:var(--g);font-weight:800;background:#eaf8ef}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;max-width:360px;background:#172033;color:#fff;border-radius:12px;padding:11px 15px;display:none;z-index:80}pre{white-space:pre-wrap;font:inherit;line-height:1.5;margin:0}</style></head><body><main class="app"><section id="home" class="screen active"><div class="brand"><img id="brandLogo" class="logo" src="https://play-lh.googleusercontent.com/jChxNWXw8WrCJ73jKiE1Z2UcR4lReT8I6ANKUU7-2xIQANwAX1zY6rzqLP8JfgUD4qNcbcmQeqXhZjfiUr0P" alt="Itália Supermercado" referrerpolicy="no-referrer"><div id="fallback" class="fallback"><strong>itália</strong><span>SUPERMERCADO</span></div></div><div class="hero"><h1>Olá! 👋</h1><p>Gerencie seus pedidos de carnes de forma rápida e prática.</p></div><button class="primary" data-go="new-order"><span class="picon">＋</span><span class="pcopy"><strong>Novo pedido</strong><span>Criar um novo pedido de carnes</span></span><span class="chev">›</span></button><h3 class="title">Acesso rápido</h3><div class="grid"><button class="quick" data-go="products"><span class="icon blue"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span><strong>Produtos</strong><small>Carnes, caixas e unidades</small></button><button class="quick" data-go="suppliers"><span class="icon green"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><strong>Fornecedores</strong><small>Gerenciar contatos</small></button><button class="quick" data-go="orders"><span class="icon purple"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span><strong>Pedidos</strong><small>Histórico enviado</small></button><button class="quick" data-go="orders"><span class="icon orange"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg></span><strong>Relatórios</strong><small>Resumo dos pedidos</small></button></div><div class="panel"><div class="panel-title">Pedidos recentes</div><div id="recentOrders" class="empty">Nenhum pedido ainda<small>Crie seu primeiro pedido.</small></div></div></section><section id="suppliers" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2><span></span></div><div class="form"><input id="supplierName" class="input" placeholder="Nome do fornecedor"><input id="supplierPhone" class="input" inputmode="tel" placeholder="WhatsApp com DDD"><button id="saveSupplier" class="btn g full">Salvar fornecedor</button></div><div id="supplierList"></div></section><section id="products" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Produtos</h2><span></span></div><div class="form"><input id="productName" class="input" placeholder="Nome da carne"><input id="productCategory" class="input" placeholder="Categoria"><div class="checks"><label><input id="allowBox" type="checkbox" checked> Caixa</label><label><input id="allowUnit" type="checkbox"> Unidade</label></div><button id="saveProduct" class="btn g full">Salvar produto</button></div><div id="productList"></div></section><section id="new-order" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Novo pedido</h2><span></span></div><div class="form"><label>Fornecedor</label><select id="supplierSelect"></select></div><div id="orderProducts"></div><button id="reviewOrder" class="btn g full">Revisar pedido</button></section><section id="review" class="screen"><div class="head"><button class="back" data-go="new-order">←</button><h2>Revisar pedido</h2><span></span></div><div class="form"><input id="responsible" class="input" placeholder="Responsável"><textarea id="notes" rows="3" placeholder="Observação"></textarea></div><div class="form"><pre id="summaryText"></pre></div><button id="openWhatsapp" class="btn r full">Abrir no WhatsApp</button></section><section id="orders" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Pedidos</h2><span></span></div><div id="ordersList" class="orders-list"></div></section></main><nav class="nav"><button data-go="home" class="active"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>Início</button><button data-go="new-order"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Novo pedido</button><button data-go="orders"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>Pedidos</button><button data-go="suppliers"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Fornecedores</button><button data-go="products"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>Produtos</button></nav><div id="toast" class="toast"></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const logo=$('#brandLogo'),fallback=$('#fallback');logo.onerror=()=>{logo.style.display='none';fallback.style.display='block'};const seeds=[{id:1,name:'Hallan',phone:'66996022643'}],seedp=[{id:1,name:'Coxão mole',category:'Caixaria',box:true,unit:false},{id:2,name:'Contrafilé',category:'Caixaria',box:true,unit:true},{id:3,name:'Costela janela',category:'Costelas',box:false,unit:true}];let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||seeds,products=JSON.parse(localStorage.getItem('italia_products')||'null')||seedp,orders=JSON.parse(localStorage.getItem('italia_orders')||'[]'),order={};function persist(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products',JSON.stringify(products));localStorage.setItem('italia_orders',JSON.stringify(orders))}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function go(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();if(id==='orders')renderOrders();if(id==='home')renderRecent();scrollTo({top:0,behavior:'smooth'})}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function renderSuppliers(){const e=$('#supplierList');e.innerHTML=suppliers.map(s=>`<div class="item"><div class="row between"><div><strong>${s.name}</strong><div class="muted">${s.phone}</div></div><button class="del" data-s="${s.id}">Excluir</button></div></div>`).join('');e.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{suppliers=suppliers.filter(s=>s.id!=b.dataset.s);persist();renderSuppliers()})}function renderProducts(){const e=$('#productList');e.innerHTML=products.map(p=>`<div class="item"><div class="row between"><div><strong>${p.name}</strong><div class="muted">${p.category} · ${[p.box?'Caixa':'',p.unit?'Unidade':''].filter(Boolean).join(' e ')}</div></div><button class="del" data-p="${p.id}">Excluir</button></div></div>`).join('');e.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!=b.dataset.p);persist();renderProducts()})}$('#saveSupplier').onclick=()=>{const name=$('#supplierName').value.trim(),phone=$('#supplierPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válido');suppliers.push({id:Date.now(),name,phone});persist();$('#supplierName').value='';$('#supplierPhone').value='';renderSuppliers();toast('Fornecedor salvo')};$('#saveProduct').onclick=()=>{const name=$('#productName').value.trim(),category=$('#productCategory').value.trim(),box=$('#allowBox').checked,unit=$('#allowUnit').checked;if(name.length<2||category.length<2||(!box&&!unit))return toast('Preencha os dados');products.push({id:Date.now(),name,category,box,unit});persist();$('#productName').value='';$('#productCategory').value='';renderProducts();toast('Produto salvo')};function qty(id,type,label){return `<div class="row between" style="margin-top:11px"><span class="muted">${label}</span><div class="qty"><button data-q="${id}:${type}:-1">−</button><strong>${order[id][type]}</strong><button data-q="${id}:${type}:1">+</button></div></div>`}function renderOrder(){const s=$('#supplierSelect');s.innerHTML=suppliers.length?suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''):'<option>Nenhum fornecedor</option>';const groups={};products.forEach(p=>(groups[p.category]??=[]).push(p));$('#orderProducts').innerHTML=Object.entries(groups).map(([c,list])=>`<div class="category">${c}</div>${list.map(p=>{order[p.id]??={box:0,unit:0};return `<div class="item"><strong>${p.name}</strong>${p.box?qty(p.id,'box','caixas'):''}${p.unit?qty(p.id,'unit','unidades'):''}</div>`}).join('')}`).join('');$$('[data-q]').forEach(b=>b.onclick=()=>{const[id,t,d]=b.dataset.q.split(':');order[id][t]=Math.max(0,Math.min(999,order[id][t]+Number(d)));renderOrder()})}function build(){const supplier=suppliers.find(s=>String(s.id)===$('#supplierSelect').value)||suppliers[0],lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${supplier?.name||''}`,''];const groups={};products.forEach(p=>{const q=order[p.id];if(q&&(q.box||q.unit))(groups[p.category]??=[]).push({p,q})});Object.entries(groups).forEach(([c,list])=>{lines.push(`*${c.toUpperCase()}*`);list.forEach(({p,q})=>{const parts=[];if(q.box)parts.push(`${q.box} caixa(s)`);if(q.unit)parts.push(`${q.unit} unidade(s)`);lines.push(`• ${p.name}: ${parts.join(' e ')}`)});lines.push('')});const r=$('#responsible').value.trim(),n=$('#notes').value.trim();if(r)lines.push(`Responsável: ${r}`);if(n)lines.push(`Observação: ${n}`);return{text:lines.join('\n'),supplier}}$('#reviewOrder').onclick=()=>Object.values(order).some(v=>v.box||v.unit)?go('review'):toast('Adicione ao menos um item');function renderReview(){$('#summaryText').textContent=build().text}$('#openWhatsapp').onclick=()=>{const data=build();orders.unshift({id:Date.now(),date:new Date().toLocaleString('pt-BR'),supplier:data.supplier?.name||'',text:data.text});orders=orders.slice(0,50);persist();const phone=data.supplier?.phone?.replace(/\D/g,'')||'';window.open(`https://wa.me/55${phone}?text=${encodeURIComponent(data.text)}`,'_blank');order={};renderRecent()};function renderOrders(){const e=$('#ordersList');if(!orders.length){e.innerHTML='<div class="empty">Nenhum pedido salvo<small>Os pedidos enviados aparecerão aqui.</small></div>';return}e.innerHTML=orders.map(o=>`<article class="order-card"><div class="top"><div><strong>${o.supplier||'Fornecedor'}</strong><div class="muted">${o.date}</div></div><span class="badge">Enviado</span></div><pre>${o.text}</pre></article>`).join('')}function renderRecent(){const e=$('#recentOrders');if(!orders.length){e.innerHTML='Nenhum pedido ainda<small>Crie seu primeiro pedido.</small>';return}const o=orders[0];e.innerHTML=`<strong>${o.supplier}</strong><small>${o.date}</small>`}renderRecent();</script></body></html>
