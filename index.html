<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#078f45"><title>Itália Supermercado — Pedidos</title><style>:root{--g:#078f45;--g2:#16ad5b;--r:#cf3347;--i:#172033;--m:#697386;--l:#e4ebe7;--bg:#f4f7f5;--s:0 10px 26px rgba(23,32,51,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff 0 220px,var(--bg) 520px);color:var(--i);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;padding:12px 15px calc(104px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.brand{height:68px;display:grid;place-items:center}.logo{width:94px;max-height:62px;object-fit:contain}.hero{text-align:center;margin-bottom:14px}.hero h1{font-size:23px;margin:0 0 4px}.hero p{font-size:12.5px;color:var(--m);margin:0}.primary{width:100%;border:0;border-radius:21px;min-height:78px;padding:14px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;grid-template-columns:48px 1fr 30px;gap:11px;align-items:center;text-align:left;box-shadow:0 15px 30px rgba(7,143,69,.22)}.picon{width:48px;height:48px;border-radius:15px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:28px}.pcopy strong{display:block;font-size:18px}.pcopy span{font-size:11.5px}.chev{font-size:24px}.section-title{text-align:center;font-size:16px;margin:20px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick,.card,.form,.product,.order-card,.admin-card{background:#fff;border:1px solid var(--l);border-radius:19px;box-shadow:var(--s)}.quick{min-height:112px;padding:13px 10px;text-align:center}.quick .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin:0 auto 9px;font-size:20px}.quick strong{display:block;font-size:14.5px}.quick small{display:block;color:var(--m);font-size:10.8px;margin-top:4px;line-height:1.35}.green{background:#e9f8ef}.blue{background:#edf5ff}.purple{background:#f4edff}.orange{background:#fff2e7}.card{padding:14px;margin-top:16px}.title{text-align:center;font-weight:800;font-size:15px;margin-bottom:10px}.page-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin:4px 0 14px}.page-head h2{text-align:center;margin:0;font-size:22px}.back{width:40px;height:40px;border:0;border-radius:13px;background:#e8f6ed;color:var(--g);font-size:20px}.form{padding:14px;margin-bottom:12px}.label{display:block;font-size:11px;font-weight:800;color:#465165;margin:1px 2px 5px}.input,select,textarea{width:100%;border:1px solid #d8e0dc;border-radius:13px;padding:12px 13px;margin:0 0 9px;background:#fff;color:var(--i);outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(7,143,69,.11)}.btn{border:0;border-radius:13px;min-height:46px;padding:12px 15px;font-weight:800}.btn.full{width:100%}.btn.g{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.btn.r{background:linear-gradient(135deg,#ca3144,#df4053);color:#fff}.btn.soft{background:#edf8f1;color:var(--g)}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 9px;scrollbar-width:none}.tab{flex:none;border:1px solid var(--l);background:#fff;color:#596579;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.tab.active{background:#e9f8ef;color:var(--g);border-color:var(--g)}.product,.admin-card{padding:12px;margin:8px 0}.product-top,.row,.order-top{display:flex;align-items:center;justify-content:space-between;gap:9px}.name{font-size:13.5px;font-weight:850}.muted{color:var(--m);font-size:11px;margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{background:#f1f5f3;border-radius:999px;padding:4px 7px;font-size:9.5px;font-weight:750;color:#596579}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid var(--l);background:#fff;border-radius:10px;padding:7px 8px;font-size:10px;font-weight:800}.mini.on{background:#e9f8ef;color:var(--g)}.mini.danger{background:#fff0f2;color:var(--r)}.empty{text-align:center;border:1px dashed #cfe5d7;background:#f0faf4;border-radius:15px;padding:18px 12px}.empty strong{display:block;font-size:12.5px}.empty small{color:var(--m);font-size:10.5px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}.mode-grid label{border:1px solid var(--l);border-radius:11px;padding:8px;font-size:11px}.qty-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:37px;height:37px;border-radius:12px;border:1px solid #d8e0dc;background:#fff;font-size:19px}.selected{background:#172033;color:#fff;border-radius:15px;padding:10px 12px;margin:10px 0;display:flex;justify-content:space-between;font-size:11px}.orders-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}.order-card{padding:13px;margin-bottom:9px}.order-card h3{font-size:13px;margin:0}.badge{border-radius:999px;padding:5px 8px;font-size:9px;font-weight:850}.status-Rascunho{background:#fff5dc;color:#946500}.status-Enviado{background:#e8f7ee;color:var(--g)}.status-Confirmado{background:#eaf2ff;color:#2f6ab3}.status-Recebido{background:#f0eaff;color:#7150ae}.status-Cancelado{background:#fff0f2;color:var(--r)}.order-card pre{max-height:80px;overflow:hidden;white-space:pre-wrap;font:inherit;font-size:10.8px;line-height:1.45;color:#4e596b}.order-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.switch{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:750}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px;text-align:center}.stat strong{display:block;font-size:17px}.stat small{font-size:9.5px;color:var(--m)}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.97);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:50}.nav button{border:0;background:none;color:#758092;border-radius:13px;padding:6px 2px;font-size:9px;min-height:50px}.nav button span{display:block;font-size:20px}.nav button.active{background:#eaf7ef;color:var(--g);font-weight:850}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#172033;color:#fff;border-radius:12px;padding:10px 14px;display:none;z-index:100;font-size:12px}</style></head><body><main class="app"><section id="home" class="screen active"><div class="brand"><img id="logo" class="logo" src="https://play-lh.googleusercontent.com/jChxNWXw8WrCJ73jKiE1Z2UcR4lReT8I6ANKUU7-2xIQANwAX1zY6rzqLP8JfgUD4qNcbcmQeqXhZjfiUr0P" alt="Itália"></div><div class="hero"><h1>Olá! 👋</h1><p>Pedidos de carnes organizados por categoria.</p></div><button class="primary" data-go="new-order"><span class="picon">＋</span><span class="pcopy"><strong>Novo pedido</strong><span>Criar ou editar um pedido</span></span><span class="chev">›</span></button><h3 class="section-title">Acesso rápido</h3><div class="grid"><button class="quick" data-go="products"><span class="ico blue">📦</span><strong>Produtos</strong><small>Lista organizada</small></button><button class="quick" data-go="suppliers"><span class="ico green">👥</span><strong>Fornecedores</strong><small>Contatos cadastrados</small></button><button class="quick" data-go="orders"><span class="ico purple">📋</span><strong>Pedidos</strong><small>Status e histórico</small></button><button class="quick" data-go="admin"><span class="ico orange">⚙️</span><strong>Administrar</strong><small>Configurar o sistema</small></button></div><div class="card"><div class="title">Pedidos recentes</div><div id="recent"></div></div></section><section id="suppliers" class="screen"><header class="page-head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2><span></span></header><div class="form"><label class="label">Nome</label><input id="supplierName" class="input"><label class="label">WhatsApp</label><input id="supplierPhone" class="input" inputmode="tel"><button id="saveSupplier" class="btn g full">Salvar fornecedor</button></div><div id="supplierList"></div></section><section id="products" class="screen"><header class="page-head"><button class="back" data-go="home">←</button><h2>Produtos</h2><span></span></header><div id="productTabs" class="tabs"></div><input id="productSearch" class="input" placeholder="Buscar produto"><div id="productList"></div></section><section id="admin" class="screen"><header class="page-head"><button class="back" data-go="home">←</button><h2>Administrar</h2><span></span></header><div id="adminStats" class="admin-stats"></div><div class="tabs"><button class="tab active" data-admin="products">Produtos</button><button class="tab" data-admin="categories">Categorias</button><button class="tab" data-admin="backup">Backup</button></div><div id="adminProducts"><div class="form"><input id="editId" type="hidden"><label class="label">Produto</label><input id="adminName" class="input"><label class="label">Código interno</label><input id="adminCode" class="input"><label class="label">Categoria</label><select id="adminCategory"></select><label class="label">Formas de pedido</label><div id="adminModes" class="mode-grid"></div><label class="switch"><input id="adminActive" type="checkbox" checked> Produto ativo</label><label class="switch"><input id="adminFavorite" type="checkbox"> Favorito</label><div class="row" style="margin-top:10px"><button id="clearProduct" class="btn soft" style="flex:1">Limpar</button><button id="saveProduct" class="btn g" style="flex:1">Salvar</button></div></div><input id="adminSearch" class="input" placeholder="Buscar produto"><div id="adminProductList"></div></div><div id="adminCategories" style="display:none"><div class="form"><label class="label">Nova categoria</label><input id="newCategory" class="input"><button id="addCategory" class="btn g full">Adicionar categoria</button></div><div id="categoryList"></div></div><div id="adminBackup" style="display:none"><div class="form"><button id="exportData" class="btn g full">Exportar backup</button><label class="label" style="margin-top:12px">Importar backup</label><textarea id="backupText" rows="8" placeholder="Cole aqui o conteúdo do backup"></textarea><button id="importData" class="btn soft full">Importar dados</button></div></div></section><section id="new-order" class="screen"><header class="page-head"><button class="back" data-go="home">←</button><h2>Novo pedido</h2><span></span></header><div class="form"><label class="label">Fornecedor</label><select id="supplierSelect"></select></div><div id="orderTabs" class="tabs"></div><input id="orderSearch" class="input" placeholder="Buscar produto"><div id="orderProducts"></div><div class="selected"><span>Itens selecionados</span><strong id="selectedCount">0</strong></div><button id="reviewOrder" class="btn g full">Revisar pedido</button></section><section id="review" class="screen"><header class="page-head"><button class="back" data-go="new-order">←</button><h2>Revisar</h2><span></span></header><div class="form"><label class="label">Responsável</label><input id="responsible" class="input"><label class="label">Observação</label><textarea id="notes" rows="3"></textarea></div><div class="form"><pre id="summaryText"></pre></div><div class="row"><button id="saveDraft" class="btn soft" style="flex:1">Salvar</button><button id="openWhatsapp" class="btn r" style="flex:1">WhatsApp</button></div></section><section id="orders" class="screen"><header class="page-head"><button class="back" data-go="home">←</button><h2>Pedidos</h2><span></span></header><div class="orders-toolbar"><select id="statusFilter"><option value="">Todos</option><option>Rascunho</option><option>Enviado</option><option>Confirmado</option><option>Recebido</option><option>Cancelado</option></select><input id="ordersSearch" class="input" placeholder="Buscar" style="margin:0"></div><div id="ordersList"></div></section></main><nav class="nav"><button data-go="home" class="active"><span>⌂</span>Início</button><button data-go="new-order"><span>⊕</span>Novo</button><button data-go="orders"><span>▤</span>Pedidos</button><button data-go="suppliers"><span>♧</span>Fornec.</button><button data-go="admin"><span>⚙</span>Admin</button></nav><div id="toast" class="toast"></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],modes=['Caixa','Unidade','Carcaça','Inteiro','Peça'];let categories=JSON.parse(localStorage.getItem('italia_categories')||'null')||['Bovinos','Suínos','Miúdos','Linguiças','Bacon','Frango'];const seed=[['Coxão mole','Bovinos',['Caixa']],['Contrafilé','Bovinos',['Caixa']],['Costela janela','Bovinos',['Unidade']],['Carcaça suína','Suínos',['Carcaça']],['Suíno inteiro','Suínos',['Inteiro']],['Fígado bovino','Miúdos',['Caixa']],['Coração bovino','Miúdos',['Caixa']],['Mocotó','Miúdos',['Caixa']],['Bucho','Miúdos',['Caixa']],['Calabresa','Linguiças',['Caixa']],['Toscana','Linguiças',['Caixa']],['Caseira','Linguiças',['Caixa']],['Apimentada','Linguiças',['Caixa']],['Bacon','Bacon',['Peça']],['Meio da asa','Frango',['Caixa']],['Coxinha da asa','Frango',['Caixa']],['Coração de frango','Frango',['Caixa']],['Coxa e sobrecoxa','Frango',['Caixa']]].map((x,i)=>({id:i+1,name:x[0],category:x[1],modes:x[2],code:'',active:true,favorite:false,order:i}));let products=JSON.parse(localStorage.getItem('italia_products_admin')||'null')||seed,suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||[{id:1,name:'Hallan',phone:'66996022643'}],orders=JSON.parse(localStorage.getItem('italia_orders_v2')||'[]'),currentOrder={},activeCategory=categories[0];function persist(){localStorage.setItem('italia_categories',JSON.stringify(categories));localStorage.setItem('italia_products_admin',JSON.stringify(products));localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_orders_v2',JSON.stringify(orders))}function toast(x){toastEl.textContent=x;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',1800)}const toastEl=$('#toast');function go(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));if(id==='home')renderRecent();if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='admin')renderAdmin();if(id==='new-order')renderOrder();if(id==='review')renderReview();if(id==='orders')renderOrders();scrollTo(0,0)}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function tabs(el,fn){$(el).innerHTML=categories.map(c=>`<button class="tab ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');$(el).querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;fn()})}function renderSuppliers(){supplierList.innerHTML=suppliers.map(s=>`<div class="product"><div class="product-top"><div><div class="name">${s.name}</div><div class="muted">${s.phone}</div></div><button class="mini danger" data-del="${s.id}">Excluir</button></div></div>`).join('');supplierList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir fornecedor?')){suppliers=suppliers.filter(x=>x.id!=b.dataset.del);persist();renderSuppliers()}})}saveSupplier.onclick=()=>{const n=supplierName.value.trim(),p=supplierPhone.value.replace(/\D/g,'');if(n.length<2||p.length<10)return toast('Dados inválidos');suppliers.push({id:Date.now(),name:n,phone:p});supplierName.value=supplierPhone.value='';persist();renderSuppliers()};function renderProducts(){tabs('#productTabs',renderProducts);const q=productSearch.value.toLowerCase();const list=products.filter(p=>p.active&&p.category===activeCategory&&p.name.toLowerCase().includes(q)).sort((a,b)=>(b.favorite-a.favorite)||(a.order-b.order));productList.innerHTML=list.length?list.map(p=>`<div class="product"><div class="name">${p.favorite?'★ ':''}${p.name}</div><div class="muted">${p.code||'Sem código'}</div><div class="chips">${p.modes.map(m=>`<span class="chip">${m}</span>`).join('')}</div></div>`).join(''):`<div class="empty"><strong>Nenhum produto ativo</strong></div>`}productSearch.oninput=renderProducts;function renderAdmin(){adminStats.innerHTML=`<div class="stat"><strong>${products.length}</strong><small>Produtos</small></div><div class="stat"><strong>${products.filter(x=>x.active).length}</strong><small>Ativos</small></div><div class="stat"><strong>${categories.length}</strong><small>Categorias</small></div>`;adminCategory.innerHTML=categories.map(c=>`<option>${c}</option>`).join('');adminModes.innerHTML=modes.map(m=>`<label><input type="checkbox" value="${m}"> ${m}</label>`).join('');renderAdminProducts();renderCategories()}$$('[data-admin]').forEach(b=>b.onclick=()=>{$$('[data-admin]').forEach(x=>x.classList.toggle('active',x===b));adminProducts.style.display=b.dataset.admin==='products'?'block':'none';adminCategories.style.display=b.dataset.admin==='categories'?'block':'none';adminBackup.style.display=b.dataset.admin==='backup'?'block':'none'});function renderAdminProducts(){const q=adminSearch.value.toLowerCase();const list=products.filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>a.order-b.order);adminProductList.innerHTML=list.map(p=>`<div class="admin-card"><div class="product-top"><div><div class="name">${p.favorite?'★ ':''}${p.name}</div><div class="muted">${p.category} · ${p.active?'Ativo':'Inativo'}</div></div><div class="actions"><button class="mini" data-up="${p.id}">↑</button><button class="mini" data-down="${p.id}">↓</button><button class="mini on" data-edit="${p.id}">Editar</button><button class="mini danger" data-del="${p.id}">Excluir</button></div></div></div>`).join('');adminProductList.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>loadProduct(+b.dataset.edit));adminProductList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir definitivamente este produto?')){products=products.filter(x=>x.id!=b.dataset.del);persist();renderAdmin()}});adminProductList.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));adminProductList.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}adminSearch.oninput=renderAdminProducts;function move(id,d){const sorted=[...products].sort((a,b)=>a.order-b.order),i=sorted.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=sorted.length)return;[sorted[i].order,sorted[j].order]=[sorted[j].order,sorted[i].order];persist();renderAdminProducts()}function loadProduct(id){const p=products.find(x=>x.id===id);editId.value=id;adminName.value=p.name;adminCode.value=p.code||'';adminCategory.value=p.category;adminActive.checked=p.active;adminFavorite.checked=p.favorite;adminModes.querySelectorAll('input').forEach(x=>x.checked=p.modes.includes(x.value));scrollTo(0,0)}clearProduct.onclick=()=>{editId.value='';adminName.value=adminCode.value='';adminActive.checked=true;adminFavorite.checked=false;adminModes.querySelectorAll('input').forEach(x=>x.checked=false)};saveProduct.onclick=()=>{const name=adminName.value.trim(),selected=[...adminModes.querySelectorAll('input:checked')].map(x=>x.value);if(name.length<2||!selected.length)return toast('Informe nome e forma');const data={id:editId.value?+editId.value:Date.now(),name,code:adminCode.value.trim(),category:adminCategory.value,modes:selected,active:adminActive.checked,favorite:adminFavorite.checked,order:editId.value?(products.find(x=>x.id==editId.value)?.order||0):products.length};products=editId.value?products.map(x=>x.id===data.id?data:x):[...products,data];persist();clearProduct.click();renderAdmin();toast('Produto salvo')};function renderCategories(){categoryList.innerHTML=categories.map(c=>`<div class="admin-card"><div class="product-top"><div class="name">${c}</div><button class="mini danger" data-catdel="${c}">Excluir</button></div></div>`).join('');categoryList.querySelectorAll('[data-catdel]').forEach(b=>b.onclick=()=>{const c=b.dataset.catdel;if(products.some(p=>p.category===c))return toast('Mova os produtos antes');if(confirm('Excluir categoria?')){categories=categories.filter(x=>x!==c);activeCategory=categories[0]||'';persist();renderAdmin()}})}addCategory.onclick=()=>{const c=newCategory.value.trim();if(c.length<2||categories.includes(c))return toast('Categoria inválida');categories.push(c);newCategory.value='';persist();renderAdmin()};exportData.onclick=()=>{backupText.value=JSON.stringify({categories,products,suppliers,orders},null,2);backupText.select();navigator.clipboard?.writeText(backupText.value);toast('Backup gerado e copiado')};importData.onclick=()=>{try{const d=JSON.parse(backupText.value);if(!d.products||!d.categories)throw 0;categories=d.categories;products=d.products;suppliers=d.suppliers||suppliers;orders=d.orders||orders;persist();activeCategory=categories[0];renderAdmin();toast('Backup importado')}catch{toast('Backup inválido')}};function renderOrder(){tabs('#orderTabs',renderOrder);supplierSelect.innerHTML=suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');const q=orderSearch.value.toLowerCase();const list=products.filter(p=>p.active&&p.category===activeCategory&&p.name.toLowerCase().includes(q)).sort((a,b)=>(b.favorite-a.favorite)||(a.order-b.order));orderProducts.innerHTML=list.map(p=>`<div class="product"><div class="name">${p.favorite?'★ ':''}${p.name}</div>${p.modes.map(m=>{currentOrder[p.id]??={};currentOrder[p.id][m]??=0;return `<div class="qty-row"><span class="muted">${m}</span><div class="qty"><button data-q="${p.id}|${m}|-1">−</button><strong>${currentOrder[p.id][m]}</strong><button data-q="${p.id}|${m}|1">+</button></div></div>`}).join('')}</div>`).join('');orderProducts.querySelectorAll('[data-q]').forEach(b=>b
