<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0aa04f">
<title>Itália Supermercado — Pedidos</title>
<style>
:root{--g:#0aa04f;--g2:#12b65d;--r:#d83246;--t:#162033;--m:#667085;--l:#e7ece9;--bg:#f6f8f7;--s:0 8px 24px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff 0 230px,var(--bg) 430px);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.985)}
main{width:min(100%,520px);margin:auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}
.brand{display:flex;justify-content:center;align-items:center;height:96px;margin:0 auto}.logo{width:108px;max-width:34vw;height:auto;display:block;object-fit:contain}.logo-fallback{display:none;text-align:center}.logo-fallback strong{display:block;color:#c93142;font-size:34px;line-height:.9}.logo-fallback span{display:block;color:#29984d;font-size:9px;font-weight:900;letter-spacing:3px;margin-top:4px}
.hero{text-align:center;margin:0 0 16px}.hero h1{font-size:26px;margin:0 0 4px}.hero p{margin:0 auto;color:var(--m);font-size:14px;line-height:1.4;max-width:330px}
.primary{width:100%;border:0;border-radius:20px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:12px;padding:14px 16px;box-shadow:0 12px 26px rgba(10,160,79,.20);text-align:left;min-height:82px}.picon{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--g);display:grid;place-items:center}.pcopy strong{display:block;font-size:20px;margin-bottom:3px}.pcopy span{font-size:13px;opacity:.95}.chev{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:25px}
.title{font-size:18px;margin:22px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.q{border:1px solid var(--l);background:#fff;border-radius:18px;padding:14px;text-align:left;box-shadow:var(--s);min-height:125px}.qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:11px}.q strong{display:block;font-size:16px}.q span{display:block;color:var(--m);font-size:12px;line-height:1.3;margin-top:5px}.g{background:#eaf9f0;color:var(--g)}.b{background:#eef5ff;color:#3978d6}.p{background:#f5edff;color:#8657c8}.o{background:#fff2e8;color:#d56b22}
.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.panel,.form,.item{background:#fff;border:1px solid var(--l);border-radius:20px;box-shadow:var(--s)}.panel{padding:16px;margin:18px 0}.pt{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;margin-bottom:12px}.pt small{font-size:13px;color:var(--g)}.empty{background:#f0faf4;border-radius:15px;padding:19px 14px;text-align:center;font-weight:700}.empty small{display:block;color:var(--m);font-weight:400;margin-top:5px;font-size:13px}
.head{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.back{width:42px;height:42px;border:0;border-radius:13px;background:#edf8f2;color:var(--g);font-size:21px}.head h2{margin:0;font-size:26px}.form{padding:16px;margin-bottom:15px}.input,select,textarea{width:100%;border:1px solid #d9e0e5;border-radius:13px;padding:14px 15px;margin:6px 0 11px;background:#fff;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(10,160,79,.12)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.item{padding:15px;margin:11px 0}.muted{color:var(--m);font-size:13px;margin-top:4px}.category{font-size:18px;font-weight:800;margin:20px 2px 9px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border-radius:13px;border:1px solid #d8dedb;background:#fff;font-size:23px}.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:800;min-height:50px}.btn.green{background:var(--g);color:#fff}.btn.red{background:var(--r);color:#fff}.btn.full{width:100%}.del{border:0;background:#fff0f2;color:var(--r);border-radius:11px;padding:9px 11px;font-weight:700}.checks{display:flex;gap:18px;margin:4px 0 10px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);background:rgba(255,255,255,.98);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -7px 22px rgba(16,24,40,.06)}.nav button{border:0;background:none;color:#667085;font-size:10px;padding:6px 2px;border-radius:12px;min-height:54px}.ni{display:grid;place-items:center;margin-bottom:2px}.nav .icon{width:21px;height:21px}.nav button.active{color:var(--g);font-weight:800;background:#ecf9f1}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#162033;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:80}pre{white-space:pre-wrap;font:inherit;line-height:1.55;margin:0}
</style>
</head>
<body>
<main>
<section id="home" class="screen active">
<div class="brand"><img id="brandLogo" class="logo" src="https://play-lh.googleusercontent.com/jChxNWXw8WrCJ73jKiE1Z2UcR4lReT8I6ANKUU7-2xIQANwAX1zY6rzqLP8JfgUD4qNcbcmQeqXhZjfiUr0P" alt="Itália Supermercado" referrerpolicy="no-referrer"><div id="logoFallback" class="logo-fallback"><strong>itália</strong><span>SUPERMERCADO</span></div></div>
<div class="hero"><h1>Olá!</h1><p>Gerencie seus pedidos de carnes com rapidez.</p></div>
<button class="primary" data-go="new-order"><span class="picon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="pcopy"><strong>Novo pedido</strong><span>Criar pedido de carnes</span></span><span class="chev">›</span></button>
<h3 class="title">Acesso rápido</h3>
<div class="grid"><button class="q" data-go="products"><span class="qi b"><svg class="icon" viewBox="0 0 24 24"><path d="M21 8l-9 5-9-5 9-5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span><strong>Produtos</strong><span>Carnes, caixas e unidades</span></button><button class="q" data-go="suppliers"><span class="qi g"><svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><strong>Fornecedores</strong><span>Contatos e WhatsApp</span></button><button class="q" data-go="home"><span class="qi p"><svg class="icon" viewBox="0 0 24 24"><path d="M9 5h6M9 9h6M9 13h4"/><rect x="5" y="3" width="14" height="18" rx="2"/></svg></span><strong>Pedidos</strong><span>Ver e enviar pedidos</span></button><button class="q" data-go="home"><span class="qi o"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg></span><strong>Relatórios</strong><span>Resumo dos pedidos</span></button></div>
<div class="panel"><div class="pt"><span>Pedidos recentes</span><small>Ver todos</small></div><div class="empty">Nenhum pedido ainda<small>Toque em “Novo pedido” para começar.</small></div></div>
</section>
<section id="suppliers" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2></div><div class="form"><input id="supplierName" class="input" placeholder="Nome do fornecedor"><input id="supplierPhone" class="input" inputmode="tel" placeholder="WhatsApp com DDD"><button id="saveSupplier" class="btn green full">Salvar fornecedor</button></div><div id="supplierList"></div></section>
<section id="products" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Produtos</h2></div><div class="form"><input id="productName" class="input" placeholder="Nome da carne"><input id="productCategory" class="input" placeholder="Categoria, ex.: Caixaria"><div class="checks"><label><input id="allowBox" type="checkbox" checked> Caixa</label><label><input id="allowUnit" type="checkbox"> Unidade</label></div><button id="saveProduct" class="btn green full">Salvar produto</button></div><div id="productList"></div></section>
<section id="new-order" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Novo pedido</h2></div><div class="form"><label>Fornecedor</label><select id="supplierSelect"></select></div><div id="orderProducts"></div><button id="reviewOrder" class="btn green full">Revisar pedido</button></section>
<section id="review" class="screen"><div class="head"><button class="back" data-go="new-order">←</button><h2>Revisar pedido</h2></div><div class="form"><input id="responsible" class="input" placeholder="Nome do responsável"><textarea id="notes" rows="3" placeholder="Observação"></textarea></div><div class="form"><pre id="summaryText"></pre></div><button id="openWhatsapp" class="btn red full">Abrir no WhatsApp</button></section>
</main>
<nav class="nav"><button data-go="home" class="active"><span class="ni"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span>Início</button><button data-go="new-order"><span class="ni"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>Novo</button><button data-go="home"><span class="ni"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>Pedidos</button><button data-go="suppliers"><span class="ni"><svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M17 11a4 4 0 0 0 0-8M22 21v-2a4 4 0 0 0-3-3.87"/></svg></span>Fornec.</button><button data-go="products"><span class="ni"><svg class="icon" viewBox="0 0 24 24"><path d="M21 8l-9 5-9-5 9-5 9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg></span>Produtos</button></nav>
<div id="toast" class="toast"></div>
<script>
const logo=document.getElementById('brandLogo'),fallback=document.getElementById('logoFallback');logo.onerror=()=>{logo.style.display='none';fallback.style.display='block'};
const seedSuppliers=[{id:1,name:'Hallan',phone:'66996022643'}],seedProducts=[{id:1,name:'Coxão mole',category:'Caixaria',box:true,unit:false},{id:2,name:'Contrafilé',category:'Caixaria',box:true,unit:true},{id:3,name:'Costela janela',category:'Costelas',box:false,unit:true}];let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||seedSuppliers,products=JSON.parse(localStorage.getItem('italia_products')||'null')||seedProducts,order={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products',JSON.stringify(products))}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function go(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();scrollTo(0,0)}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function renderSuppliers(){const e=$('#supplierList');e.innerHTML='';suppliers.forEach(s=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row between"><div><strong>${s.name}</strong><div class="muted">${s.phone}</div></div><button class="del" data-del="${s.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{suppliers=suppliers.filter(s=>s.id!=b.dataset.del);save();renderSuppliers()})}function renderProducts(){const e=$('#productList');e.innerHTML='';products.forEach(p=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row between"><div><strong>${p.name}</strong><div class="muted">${p.category} · ${[p.box?'Caixa':'',p.unit?'Unidade':''].filter(Boolean).join(' e ')}</div></div><button class="del" data-del="${p.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!=b.dataset.del);save();renderProducts()})}$('#saveSupplier').onclick=()=>{const name=$('#supplierName').value.trim(),phone=$('#supplierPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válido');suppliers.push({id:Date.now(),name,phone});save();$('#supplierName').value='';$('#supplierPhone').value='';renderSuppliers();toast('Fornecedor salvo')};$('#saveProduct').onclick=()=>{const name=$('#productName').value.trim(),category=$('#productCategory').value.trim(),box=$('#allowBox').checked,unit=$('#allowUnit').checked;if(name.length<2||category.length<2||(!box&&!unit))return toast('Preencha os dados corretamente');products.push({id:Date.now(),name,category,box,unit});save();$('#productName').value='';$('#productCategory').value='';renderProducts();toast('Produto salvo')};function qty(id,type,label){return `<div class="row between" style="margin-top:12px"><span class="muted">${label}</span><div class="qty"><button data-q="${id}:${type}:-1">−</button><strong>${order[id][type]}</strong><button data-q="${id}:${type}:1">+</button></div></div>`}function renderOrder(){const s=$('#supplierSelect');s.innerHTML=suppliers.length?suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''):'<option>Nenhum fornecedor cadastrado</option>';const w=$('#orderProducts');w.innerHTML='';const groups={};products.forEach(p=>(groups[p.category]??=[]).push(p));Object.entries(groups).forEach(([cat,items])=>{w.insertAdjacentHTML('beforeend',`<div class="category">${cat}</div>`);items.forEach(p=>{order[p.id]??={box:0,unit:0};w.insertAdjacentHTML('beforeend',`<div class="item"><strong>${p.name}</strong>${p.box?qty(p.id,'box','caixas'):''}${p.unit?qty(p.id,'unit','unidades'):''}</div>`)})});w.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,t,d]=b.dataset.q.split(':');order[id][t]=Math.max(0,Math.min(999,order[id][t]+Number(d)));renderOrder()})}$('#reviewOrder').onclick=()=>Object.values(order).some(v=>v.box||v.unit)?go('review'):toast('Adicione ao menos um item');function build(){const supplier=suppliers.find(s=>String(s.id)===$('#supplierSelect').value)||suppliers[0],lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${supplier?.name||''}`,''],groups={};products.forEach(p=>{const q=order[p.id];if(q&&(q.box||q.unit))(groups[p.category]??=[]).push({p,q})});Object.entries(groups).forEach(([c,it])=>{lines.push(`*${c.toUpperCase()}*`);it.forEach(({p,q})=>{const a=[];if(q.box)a.push(`${q.box} caixa(s)`);if(q.unit)a.push(`${q.unit} unidade(s)`);lines.push(`• ${p.name}: ${a.join(' e ')}`)});lines.push('')});const r=$('#responsible').value.trim(),n=$('#notes').value.trim();if(r)lines.push(`Responsável: ${r}`);if(n)lines.push(`Observação: ${n}`);return{text:lines.join('\n'),supplier}}function renderReview(){$('#summaryText').textContent=build().text}$('#openWhatsapp').onclick=()=>{const x=build();window.open(`https://wa.me/55${x.supplier.phone.replace(/\D/g,'')}?text=${encodeURIComponent(x.text)}`,'_blank')};
</script>
</body>
</html>
