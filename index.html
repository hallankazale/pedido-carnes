<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#078f45"><title>Itália Supermercado — Pedidos</title><style>:root{--g:#078f45;--g2:#14ad59;--r:#cf3347;--ink:#172033;--muted:#697386;--line:#e4ebe7;--bg:#f4f7f5;--shadow:0 10px 26px rgba(23,32,51,.07)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff 0 230px,var(--bg) 520px);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;padding:14px 16px calc(106px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.brand{height:72px;display:grid;place-items:center}.logo{width:96px;max-height:64px;object-fit:contain}.fallback{display:none;text-align:center}.fallback strong{display:block;color:#c93142;font-size:30px}.fallback span{display:block;color:#29984d;font-size:9px;font-weight:900;letter-spacing:3px}.hero{text-align:center;margin:2px 0 15px}.hero h1{font-size:24px;margin:0 0 4px}.hero p{margin:auto;max-width:310px;color:var(--muted);font-size:13px;line-height:1.45}.primary{width:100%;min-height:80px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;grid-template-columns:48px 1fr 32px;align-items:center;gap:12px;padding:15px;text-align:left;box-shadow:0 16px 32px rgba(7,143,69,.21)}.picon{width:48px;height:48px;border-radius:15px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:28px}.pcopy strong{display:block;font-size:19px}.pcopy span{font-size:12px;opacity:.9}.chev{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:22px}.section-title{text-align:center;font-size:17px;margin:21px 0 10px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick,.card,.form,.product-card,.order-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.quick{min-height:118px;padding:14px 11px;text-align:center}.quick strong{display:block;font-size:15px}.quick small{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:5px}.quick-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:0 auto 10px;font-size:21px}.green{background:#e9f8ef}.blue{background:#edf5ff}.purple{background:#f4edff}.orange{background:#fff2e7}.card{padding:15px;margin-top:17px}.card-title{text-align:center;font-size:16px;font-weight:800;margin-bottom:11px}.empty{border:1px dashed #cfe5d7;background:#f0faf4;border-radius:16px;padding:20px 13px;text-align:center}.empty strong{display:block;font-size:13px}.empty small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.page-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 0 15px}.page-head h2{text-align:center;margin:0;font-size:23px}.back{width:41px;height:41px;border:0;border-radius:13px;background:#e8f6ed;color:var(--g);font-size:20px}.form{padding:14px;margin-bottom:13px}.field-label{display:block;font-size:11.5px;font-weight:800;color:#465165;margin:2px 2px 5px}.input,select,textarea{width:100%;border:1px solid #d8e0dc;border-radius:14px;padding:13px 14px;margin:0 0 10px;background:#fff;color:var(--ink);outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(7,143,69,.11)}.btn{border:0;border-radius:14px;min-height:48px;padding:13px 16px;font-weight:800}.btn.full{width:100%}.btn.g{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.btn.r{background:linear-gradient(135deg,#ca3144,#df4053);color:#fff}.btn.soft{background:#edf8f1;color:var(--g)}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;border:1px solid var(--line);background:#fff;color:#596579;border-radius:999px;padding:8px 12px;font-size:11.5px;font-weight:800}.tab.active{border-color:var(--g);background:#e9f8ef;color:var(--g)}.search{margin-bottom:10px}.product-card{padding:13px;margin:9px 0}.product-name{font-size:14px;font-weight:850}.muted{color:var(--muted);font-size:11.8px;margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{background:#f1f5f3;color:#586476;border-radius:999px;padding:5px 7px;font-size:10px;font-weight:750}.del{border:0;background:#fff0f2;color:var(--r);border-radius:10px;padding:8px 9px;font-size:11px;font-weight:800}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}.mode-grid label{border:1px solid var(--line);border-radius:11px;padding:9px;font-size:11.5px;font-weight:750;background:#fafcfb}.qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:39px;height:39px;border-radius:12px;border:1px solid #d8e0dc;background:#fff;font-size:20px}.qty strong{min-width:20px;text-align:center}.selected-summary{background:#172033;color:#fff;border-radius:16px;padding:11px 13px;margin:11px 0;display:flex;justify-content:space-between;align-items:center;font-size:11.5px}.selected-summary strong{font-size:15px}.orders-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.orders-list{display:grid;gap:10px}.order-card{padding:14px}.order-top{display:flex;justify-content:space-between;gap:10px}.order-card h3{font-size:14px;margin:0}.order-card pre{margin:9px 0 0;color:#4e596b;font-size:11.8px;line-height:1.45;white-space:pre-wrap;max-height:90px;overflow:hidden}.badge{border-radius:999px;padding:5px 8px;font-size:9.5px;font-weight:850;height:max-content}.status-Rascunho{background:#fff5dc;color:#9b6a00}.status-Enviado{background:#e8f7ee;color:var(--g)}.status-Confirmado{background:#eaf2ff;color:#2f6ab3}.status-Recebido{background:#f0eaff;color:#7150ae}.status-Cancelado{background:#fff0f2;color:var(--r)}.order-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.mini{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 5px;font-size:10px;font-weight:800;color:#536074}.mini.primary-mini{background:#e9f8ef;color:var(--g);border-color:#cfe8d8}.mini.danger{background:#fff0f2;color:var(--r);border-color:#f3d5db}.status-select{margin-top:10px;margin-bottom:0;padding:10px 11px;font-size:11px}.detail-modal{position:fixed;inset:0;background:rgba(10,18,28,.48);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:16px}.detail-modal.show{display:flex}.sheet{width:100%;max-width:430px;max-height:84vh;overflow:auto;background:#fff;border-radius:24px;padding:17px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h3{margin:0;font-size:18px}.close{width:36px;height:36px;border:0;border-radius:12px;background:#eef3f0}.sheet pre{white-space:pre-wrap;font:inherit;font-size:12.5px;line-height:1.55;background:#f7f9f8;border-radius:15px;padding:13px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -9px 28px rgba(23,32,51,.07);z-index:50}.nav button{border:0;background:none;color:#758092;border-radius:14px;padding:7px 2px;font-size:9.5px;min-height:51px}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:var(--g);font-weight:850;background:#eaf7ef}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:91px;max-width:calc(100% - 36px);background:#172033;color:#fff;border-radius:13px;padding:11px 15px;display:none;z-index:120}</style></head><body><main class="app"><section id="home" class="screen active"><div class="brand"><img id="logo" class="logo" src="https://play-lh.googleusercontent.com/jChxNWXw8WrCJ73jKiE1Z2UcR4lReT8I6ANKUU7-2xIQANwAX1zY6rzqLP8JfgUD4qNcbcmQeqXhZjfiUr0P" alt="Itália"><div id="fallback" class="fallback"><strong>itália</strong><span>SUPERMERCADO</span></div></div><div class="hero"><h1>Olá! 👋</h1><p>Pedidos de carnes organizados por categoria.</p></div><button class="primary" data-go="new-order"><span class="picon">＋</span><span class="pcopy"><strong>Novo pedido</strong><span>Criar ou editar um pedido</span></span><span class="chev">›</span></button><h3 class="section-title">Acesso rápido</h3><div class="quick-grid"><button class="quick" data-go="products"><span class="quick-icon blue">📦</span><strong>Produtos</strong><small>Organizados por abas</small></button><button class="quick" data-go="suppliers"><span class="quick-icon green">👥</span><strong>Fornecedores</strong><small>Contatos cadastrados</small></button><button class="quick" data-go="orders"><span class="quick-icon purple">📋</span><strong>Pedidos</strong><small>Status e histórico</small></button><button class="quick" data-go="orders"><span class="quick-icon orange">📊</span><strong>Relatórios</strong><small>Resumo operacional</small></button></div><div class="card"><div class="card-title">Pedidos recentes</div><div id="recentOrders"></div></div></section><section id="suppliers" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2><span></span></div><div class="form"><label class="field-label">Nome</label><input id="supplierName" class="input"><label class="field-label">WhatsApp</label><input id="supplierPhone" class="input" inputmode="tel"><button id="saveSupplier" class="btn g full">Salvar fornecedor</button></div><div id="supplierList"></div></section><section id="products" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Produtos</h2><span></span></div><div id="productTabs" class="tabs"></div><input id="productSearch" class="input search" placeholder="Buscar produto"><div id="productList"></div><div class="form" style="margin-top:13px"><label class="field-label">Novo produto</label><input id="productName" class="input"><label class="field-label">Categoria</label><select id="productCategory"></select><label class="field-label">Forma de pedido</label><div id="modeOptions" class="mode-grid"></div><button id="saveProduct" class="btn g full">Salvar produto</button></div></section><section id="new-order" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2 id="orderTitle">Novo pedido</h2><span></span></div><div class="form"><label class="field-label">Fornecedor</label><select id="supplierSelect"></select></div><div id="orderTabs" class="tabs"></div><input id="orderSearch" class="input search" placeholder="Buscar produto"><div id="orderProducts"></div><div class="selected-summary"><span>Itens selecionados</span><strong id="selectedCount">0</strong></div><button id="reviewOrder" class="btn g full">Revisar pedido</button></section><section id="review" class="screen"><div class="page-head"><button class="back" data-go="new-order">←</button><h2>Revisar pedido</h2><span></span></div><div class="form"><label class="field-label">Responsável</label><input id="responsible" class="input"><label class="field-label">Observação</label><textarea id="notes" rows="3"></textarea><label class="field-label">Status inicial</label><select id="initialStatus"><option>Rascunho</option><option>Enviado</option></select></div><div class="form"><pre id="summaryText"></pre></div><div class="row"><button id="saveDraft" class="btn soft" style="flex:1">Salvar</button><button id="openWhatsapp" class="btn r" style="flex:1">WhatsApp</button></div></section><section id="orders" class="screen"><div class="page-head"><button class="back" data-go="home">←</button><h2>Pedidos</h2><span></span></div><div class="orders-toolbar"><select id="statusFilter"><option value="">Todos os status</option><option>Rascunho</option><option>Enviado</option><option>Confirmado</option><option>Recebido</option><option>Cancelado</option></select><input id="ordersSearch" class="input" placeholder="Buscar" style="margin:0"></div><div id="ordersList" class="orders-list"></div></section></main><nav class="nav"><button data-go="home" class="active"><span>⌂</span>Início</button><button data-go="new-order"><span>⊕</span>Novo</button><button data-go="orders"><span>▤</span>Pedidos</button><button data-go="suppliers"><span>♧</span>Fornec.</button><button data-go="products"><span>◈</span>Produtos</button></nav><div id="detailModal" class="detail-modal"><div class="sheet"><div class="sheet-head"><h3>Detalhes do pedido</h3><button id="closeModal" class="close">×</button></div><pre id="detailText"></pre><div class="sheet-actions"><button id="detailEdit" class="btn soft">Editar</button><button id="detailResend" class="btn r">Reenviar</button></div></div></div><div id="toast" class="toast"></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const categories=['Bovinos','Suínos','Miúdos','Linguiças','Bacon','Frango'];const modes=['Caixa','Unidade','Carcaça','Inteiro','Peça'];const seedSuppliers=[{id:1,name:'Hallan',phone:'66996022643'}];const seedProducts=[['Coxão mole','Bovinos',['Caixa']],['Contrafilé','Bovinos',['Caixa']],['Costela janela','Bovinos',['Unidade']],['Carcaça suína','Suínos',['Carcaça']],['Suíno inteiro','Suínos',['Inteiro']],['Fígado bovino','Miúdos',['Caixa']],['Coração bovino','Miúdos',['Caixa']],['Mocotó','Miúdos',['Caixa']],['Bucho','Miúdos',['Caixa']],['Calabresa','Linguiças',['Caixa']],['Toscana','Linguiças',['Caixa']],['Caseira','Linguiças',['Caixa']],['Apimentada','Linguiças',['Caixa']],['Bacon','Bacon',['Peça']],['Meio da asa','Frango',['Caixa']],['Coxinha da asa','Frango',['Caixa']],['Coração de frango','Frango',['Caixa']],['Coxa e sobrecoxa','Frango',['Caixa']]].map((x,i)=>({id:i+1,name:x[0],category:x[1],modes:x[2]}));let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||seedSuppliers;let products=JSON.parse(localStorage.getItem('italia_products_v2')||'null')||seedProducts;let orders=JSON.parse(localStorage.getItem('italia_orders_v2')||'[]');let currentOrder={},activeCategory='Bovinos',editingId=null,detailId=null;function persist(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products_v2',JSON.stringify(products));localStorage.setItem('italia_orders_v2',JSON.stringify(orders))}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function go(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='home')renderRecent();if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();if(id==='orders')renderOrders();scrollTo(0,0)}$$('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='new-order'&&b.closest('.nav'))startNew();go(b.dataset.go)});const logo=$('#logo'),fallback=$('#fallback');logo.onerror=()=>{logo.style.display='none';fallback.style.display='block'};function tabs(target,handler){$(target).innerHTML=categories.map(c=>`<button class="tab ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');$(`${target}`).querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;handler()})}function renderSuppliers(){supplierList.innerHTML=suppliers.map(s=>`<div class="product-card"><div class="row between"><div><div class="product-name">${s.name}</div><div class="muted">${s.phone}</div></div><button class="del" data-del="${s.id}">Excluir</button></div></div>`).join('');supplierList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir fornecedor?')){suppliers=suppliers.filter(s=>s.id!=b.dataset.del);persist();renderSuppliers()}})}saveSupplier.onclick=()=>{const name=supplierName.value.trim(),phone=supplierPhone.value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válido');suppliers.push({id:Date.now(),name,phone});persist();supplierName.value=supplierPhone.value='';renderSuppliers();toast('Fornecedor salvo')};function renderProducts(){tabs('#productTabs',renderProducts);productCategory.innerHTML=categories.map(c=>`<option>${c}</option>`).join('');modeOptions.innerHTML=modes.map(m=>`<label><input type="checkbox" value="${m}"> ${m}</label>`).join('');const q=productSearch.value.toLowerCase();const list=products.filter(p=>p.category===activeCategory&&p.name.toLowerCase().includes(q));productList.innerHTML=list.length?list.map(p=>`<div class="product-card"><div class="row between"><div><div class="product-name">${p.name}</div><div class="chips">${p.modes.map(m=>`<span class="chip">${m}</span>`).join('')}</div></div><button class="del" data-del="${p.id}">Excluir</button></div></div>`).join(''):`<div class="empty"><strong>Nenhum produto</strong><small>Cadastre um produto nesta categoria.</small></div>`;productList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir produto?')){products=products.filter(p=>p.id!=b.dataset.del);persist();renderProducts()}})}productSearch.oninput=renderProducts;saveProduct.onclick=()=>{const name=productName.value.trim(),category=productCategory.value,selected=[...modeOptions.querySelectorAll('input:checked')].map(x=>x.value);if(name.length<2||!selected.length)return toast('Informe produto e forma de pedido');products.push({id:Date.now(),name,category,modes:selected});persist();productName.value='';activeCategory=category;renderProducts();toast('Produto salvo')};function startNew(){editingId=null;currentOrder={};orderTitle.textContent='Novo pedido';responsible.value='';notes.value='';initialStatus.value='Rascunho'}function renderOrder(){tabs('#orderTabs',renderOrder);supplierSelect.innerHTML=suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');const q=orderSearch.value.toLowerCase();const list=products.filter(p=>p.category===activeCategory&&p.name.toLowerCase().includes(q));orderProducts.innerHTML=list.map(p=>`<div class="product-card"><div class="product-name">${p.name}</div>${p.modes.map(m=>{currentOrder[p.id]??={};currentOrder[p.id][m]??=0;return `<div class="qty-row"><span class="muted">${m}</span><div class="qty"><button data-q="${p.id}|${m}|-1">−</button><strong>${currentOrder[p.id][m]}</strong><button data-q="${p.id}|${m}|1">+</button></div></div>`}).join('')}</div>`).join('');orderProducts.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,m,d]=b.dataset.q.split('|');currentOrder[id][m]=Math.max(0,currentOrder[id][m]+Number(d));renderOrder()});selectedCount.textContent=Object.values(currentOrder).reduce((n,x)=>n+Object.values(x).filter(v=>v>0).length,0)}orderSearch.oninput=renderOrder;reviewOrder.onclick=()=>Object.values(currentOrder).some(x=>Object.values(x).some(v=>v>0))?go('review'):toast('Adicione pelo menos um item');function buildText(){const s=suppliers.find(x=>String(x.id)===supplierSelect.value)||suppliers[0];const lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${s?.name||''}`,''];categories.forEach(c=>{const items=products.filter(p=>p.category===c).map(p=>({p,q:currentOrder[p.id]})).filter(x=>x.q&&Object.values(x.q).some(v=>v>0));if(items.length){lines.push(`*${c.toUpperCase()}*`);items.forEach(({p,q})=>lines.push(`• ${p.name}: ${Object.entries(q).filter(([,v])=>v>0).map(([m,v])=>`${v} ${m.toLowerCase()}(s)`).join(' e ')}`));lines.push('')}});if(responsible.value.trim())lines.push(`Responsável: ${responsible.value.trim()}`);if(notes.value.trim())lines.push(`Observação: ${notes.value.trim()}`);return{text:lines.join('\n'),supplier:s}}function renderReview(){summaryText.textContent=buildText().text}function saveOrder(status){const built=buildText();const data={id:editingId||Date.now(),supplierId:built.supplier?.id,supplierName:built.supplier?.name||'',phone:built.supplier?.phone||'',text:built.text,status,date:new Date().toLocaleString('pt-BR'),responsible:responsible.value.trim(),notes:notes.value.trim(),items:JSON.parse(JSON.stringify(currentOrder))};if(editingId){orders=orders.map(o=>o.id===editingId?data:o)}else orders.unshift(data);persist();editingId=null;toast('Pedido salvo');return data}saveDraft.onclick=()=>{saveOrder(initialStatus.value);go('orders')};openWhatsapp.onclick=()=>{const data=saveOrder('Enviado');window.open(`https://wa.me/55${data.phone}?text=${encodeURIComponent(data.text)}`,'_blank');go('orders')};function renderOrders(){const st=statusFilter.value,q=ordersSearch.value.toLowerCase();const list=orders.filter(o=>(!st||o.status===st)&&(o.supplierName.toLowerCase().includes(q)||o.text.toLowerCase().includes(q)));ordersList.innerHTML=list.length?list.map(o=>`<div class="order-card"><div class="order-top"><div><h3>${o.supplierName||'Sem fornecedor'}</h3><div class="muted">${o.date}</div></div><span class="badge status-${o.status}">${o.status}</span></div><pre>${o.text}</pre><select class="status-select" data-status="${o.id}">${['Rascunho','Enviado','Confirmado','Recebido','Cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><div class="order-actions"><button class="mini" data-view="${o.id}">Detalhes</button><button class="mini primary-mini" data-dup="${o.id}">Duplicar</button><button class="mini" data-edit="${o.id}">Editar</button><button class="mini" data-send="${o.id}">Reenviar</button><button class="mini danger" data-del="${o.id}">Excluir</button></div></div>`).join(''):`<div class="empty"><strong>Nenhum pedido encontrado</strong><small>Crie um novo pedido ou altere o filtro.</small></div>`;ordersList.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>{orders=orders.map(o=>o.id==x.dataset.status?{...o,status:x.value}:o);persist();renderOrders()});ordersList.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>openDetail(Number(x.dataset.view)));ordersList.querySelectorAll('[data-dup]').forEach(x=>x.onclick=()=>duplicateOrder(Number(x.dataset.dup)));ordersList.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editOrder(Number(x.dataset.edit)));ordersList.querySelectorAll('[data-send]').forEach(x=>x.onclick=()=>resend(Number(x.dataset.send)));ordersList.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(confirm('Excluir este pedido?')){orders=orders.filter(o=>o.id!=x.dataset.del);persist();renderOrders();renderRecent()}})}statusFilter.onchange=renderOrders;ordersSearch.oninput=renderOrders;function editOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;editingId=id;currentOrder=JSON.parse(JSON.stringify(o.items||{}));orderTitle.textContent='Editar pedido';responsible.value=o.responsible||'';notes.value=o.notes||'';initialStatus.value=o.status==='Enviado'?'Enviado':'Rascunho';go('new-order');setTimeout(()=>{supplierSelect.value=String(o.supplierId||'')},0)}function duplicateOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;editingId=null;currentOrder=JSON.parse(JSON.stringify(o.items||{}));orderTitle.textContent='Duplicar pedido';responsible.value=o.responsible||'';notes.value=o.notes||'';go('new-order');setTimeout(()=>{supplierSelect.value=String(o.supplierId||'')},0);toast('Pedido duplicado para edição')}function resend(id){const o=orders.find(x=>x.id===id);if(o)window.open(`https://wa.me/55${o.phone}?text=${encodeURIComponent(o.text)}`,'_blank')}function openDetail(id){const o=orders.find(x=>x.id===id);if(!o)return;detailId=id;detailText.textContent=o.text;detailModal.classList.add('show')}closeModal.onclick=()=>detailModal.classList.remove('show');detailEdit.onclick=()=>{detailModal.classList.remove('show');editOrder(detailId)};detailResend.onclick=()=>resend(detailId);function renderRecent(){const list=orders.slice(0,3);recentOrders.innerHTML=list.length?list.map(o=>`<div class="product-card"><div class="row between"><div><div class="product-name">${o.supplierName}</div><div class="muted">${o.date}</div></div><span class="badge status-${o.status}">${o.status}</span></div></div>`).join(''):`<div class="empty"><strong>Nenhum pedido ainda</strong><small>Crie seu primeiro pedido.</small></div>`}renderRecent();</script></body></html>
