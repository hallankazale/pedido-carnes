<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0aa04f"><title>Itália Supermercado — Pedidos</title><style>
:root{--g:#0aa04f;--g2:#12b65d;--r:#d83246;--t:#162033;--m:#667085;--l:#e9edf0;--bg:#f7f9fb;--s:0 10px 30px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff 0 300px,var(--bg) 560px);color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}main{width:min(100%,520px);margin:auto;padding:16px 18px calc(108px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.logo{width:190px;max-width:62vw;display:block;margin:0 auto 6px}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:31px;margin:4px 0 7px}.hero p{margin:0 auto;color:var(--m);font-size:16px;line-height:1.45;max-width:350px}.primary{width:100%;border:0;border-radius:24px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:14px;padding:18px;box-shadow:0 16px 30px rgba(10,160,79,.22);text-align:left;min-height:108px}.picon{width:62px;height:62px;border-radius:18px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:39px}.pcopy strong{display:block;font-size:23px;margin-bottom:5px}.pcopy span{font-size:15px}.chev{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:28px}.title{font-size:20px;margin:27px 2px 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.q{border:1px solid var(--l);background:#fff;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--s);min-height:145px}.qi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;margin-bottom:14px}.q strong{display:block;font-size:17px}.q span{display:block;color:var(--m);font-size:14px;line-height:1.35;margin-top:6px}.g{background:#eaf9f0}.b{background:#eef5ff}.p{background:#f5edff}.o{background:#fff2e8}.panel,.form,.item{background:#fff;border:1px solid var(--l);border-radius:22px;box-shadow:var(--s)}.panel{padding:18px;margin:22px 0}.pt{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:14px}.pt small{font-size:14px;color:var(--g)}.empty{background:#f0faf4;border-radius:16px;padding:22px 16px;text-align:center;font-weight:700}.empty small{display:block;color:var(--m);font-weight:400;margin-top:6px}.head{display:flex;align-items:center;gap:10px;margin:4px 0 18px}.back{width:44px;height:44px;border:0;border-radius:14px;background:#edf8f2;color:var(--g);font-size:22px}.head h2{margin:0;font-size:28px}.form{padding:18px;margin-bottom:16px}.input,select,textarea{width:100%;border:1px solid #d9e0e5;border-radius:14px;padding:15px 16px;margin:6px 0 12px;background:#fff;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(10,160,79,.12)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.item{padding:16px;margin:12px 0}.muted{color:var(--m);font-size:14px;margin-top:4px}.category{font-size:19px;font-weight:800;margin:22px 2px 10px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:44px;height:44px;border-radius:14px;border:1px solid #d8dedb;background:#fff;font-size:24px}.btn{border:0;border-radius:15px;padding:16px 20px;font-weight:800;min-height:52px}.btn.green{background:var(--g);color:#fff}.btn.red{background:var(--r);color:#fff}.btn.full{width:100%}.del{border:0;background:#fff0f2;color:var(--r);border-radius:12px;padding:10px 12px;font-weight:700}.checks{display:flex;gap:18px;margin:4px 0 10px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);background:rgba(255,255,255,.97);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px calc(9px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -8px 24px rgba(16,24,40,.06)}.nav button{border:0;background:none;color:#667085;font-size:11px;padding:7px 2px;border-radius:14px}.ni{display:block;font-size:24px;margin-bottom:3px}.nav button.active{color:var(--g);font-weight:800;background:#ecf9f1}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#162033;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:80}pre{white-space:pre-wrap;font:inherit;line-height:1.55;margin:0}@media(min-width:430px){.grid{grid-template-columns:repeat(4,1fr)}.q{min-height:158px}.q span{font-size:13px}}
</style></head><body><main>
<section id="home" class="screen active"><img class="logo" src="assets/italia-logo.svg?v=10" alt="Itália Supermercado"><div class="hero"><h1>Olá! 👋</h1><p>Gerencie seus pedidos de carnes de forma rápida e prática.</p></div><button class="primary" data-go="new-order"><span class="picon">＋</span><span class="pcopy"><strong>Novo pedido</strong><span>Criar um novo pedido de carnes</span></span><span class="chev">›</span></button><h3 class="title">Acesso rápido</h3><div class="grid"><button class="q" data-go="suppliers"><span class="qi g">👥</span><strong>Fornecedores</strong><span>Gerenciar fornecedores</span></button><button class="q" data-go="products"><span class="qi b">📦</span><strong>Produtos</strong><span>Carnes, caixas e unidades</span></button><button class="q" data-go="home"><span class="qi p">📋</span><strong>Pedidos</strong><span>Ver e enviar pedidos</span></button><button class="q" data-go="home"><span class="qi o">📊</span><strong>Relatórios</strong><span>Resumo dos pedidos</span></button></div><div class="panel"><div class="pt"><span>🕘 Pedidos recentes</span><small>Ver todos</small></div><div class="empty">📋 Nenhum pedido ainda<small>Crie seu primeiro pedido tocando em “Novo pedido”.</small></div></div></section>
<section id="suppliers" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Fornecedores</h2></div><div class="form"><input id="supplierName" class="input" placeholder="Nome do fornecedor"><input id="supplierPhone" class="input" inputmode="tel" placeholder="WhatsApp com DDD"><button id="saveSupplier" class="btn green full">Salvar fornecedor</button></div><div id="supplierList"></div></section>
<section id="products" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Produtos</h2></div><div class="form"><input id="productName" class="input" placeholder="Nome da carne"><input id="productCategory" class="input" placeholder="Categoria, ex.: Caixaria"><div class="checks"><label><input id="allowBox" type="checkbox" checked> Caixa</label><label><input id="allowUnit" type="checkbox"> Unidade</label></div><button id="saveProduct" class="btn green full">Salvar produto</button></div><div id="productList"></div></section>
<section id="new-order" class="screen"><div class="head"><button class="back" data-go="home">←</button><h2>Novo pedido</h2></div><div class="form"><label>Fornecedor</label><select id="supplierSelect"></select></div><div id="orderProducts"></div><button id="reviewOrder" class="btn green full">Revisar pedido</button></section>
<section id="review" class="screen"><div class="head"><button class="back" data-go="new-order">←</button><h2>Revisar pedido</h2></div><div class="form"><input id="responsible" class="input" placeholder="Nome do responsável"><textarea id="notes" rows="3" placeholder="Observação"></textarea></div><div class="form"><pre id="summaryText"></pre></div><button id="openWhatsapp" class="btn red full">Abrir no WhatsApp</button></section></main>
<nav class="nav"><button data-go="home" class="active"><span class="ni">⌂</span>Início</button><button data-go="new-order"><span class="ni">⊕</span>Novo pedido</button><button data-go="suppliers"><span class="ni">♧</span>Fornecedores</button><button data-go="products"><span class="ni">◈</span>Produtos</button><button data-go="home"><span class="ni">▣</span>Pedidos</button></nav><div id="toast" class="toast"></div>
<script>const seedSuppliers=[{id:1,name:'Hallan',phone:'66996022643'}],seedProducts=[{id:1,name:'Coxão mole',category:'Caixaria',box:true,unit:false},{id:2,name:'Contrafilé',category:'Caixaria',box:true,unit:true},{id:3,name:'Costela janela',category:'Costelas',box:false,unit:true}];let suppliers=JSON.parse(localStorage.getItem('italia_suppliers')||'null')||seedSuppliers,products=JSON.parse(localStorage.getItem('italia_products')||'null')||seedProducts,order={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem('italia_suppliers',JSON.stringify(suppliers));localStorage.setItem('italia_products',JSON.stringify(products))}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function go(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='suppliers')renderSuppliers();if(id==='products')renderProducts();if(id==='new-order')renderOrder();if(id==='review')renderReview();scrollTo(0,0)}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function renderSuppliers(){const e=$('#supplierList');e.innerHTML='';suppliers.forEach(s=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row between"><div><strong>${s.name}</strong><div class="muted">${s.phone}</div></div><button class="del" data-del="${s.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{suppliers=suppliers.filter(s=>s.id!=b.dataset.del);save();renderSuppliers()})}function renderProducts(){const e=$('#productList');e.innerHTML='';products.forEach(p=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row between"><div><strong>${p.name}</strong><div class="muted">${p.category} · ${[p.box?'Caixa':'',p.unit?'Unidade':''].filter(Boolean).join(' e ')}</div></div><button class="del" data-del="${p.id}">Excluir</button></div>`;e.appendChild(d)});e.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!=b.dataset.del);save();renderProducts()})}$('#saveSupplier').onclick=()=>{const name=$('#supplierName').value.trim(),phone=$('#supplierPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10)return toast('Informe nome e WhatsApp válido');suppliers.push({id:Date.now(),name,phone});save();$('#supplierName').value='';$('#supplierPhone').value='';renderSuppliers();toast('Fornecedor salvo')};$('#saveProduct').onclick=()=>{const name=$('#productName').value.trim(),category=$('#productCategory').value.trim(),box=$('#allowBox').checked,unit=$('#allowUnit').checked;if(name.length<2||category.length<2||(!box&&!unit))return toast('Preencha os dados corretamente');products.push({id:Date.now(),name,category,box,unit});save();$('#productName').value='';$('#productCategory').value='';renderProducts();toast('Produto salvo')};function qty(id,type,label){return `<div class="row between" style="margin-top:12px"><span class="muted">${label}</span><div class="qty"><button data-q="${id}:${type}:-1">−</button><strong>${order[id][type]}</strong><button data-q="${id}:${type}:1">+</button></div></div>`}function renderOrder(){const s=$('#supplierSelect');s.innerHTML=suppliers.length?suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''):'<option>Nenhum fornecedor cadastrado</option>';const w=$('#orderProducts');w.innerHTML='';const groups={};products.forEach(p=>(groups[p.category]??=[]).push(p));Object.entries(groups).forEach(([cat,items])=>{w.insertAdjacentHTML('beforeend',`<div class="category">${cat}</div>`);items.forEach(p=>{order[p.id]??={box:0,unit:0};w.insertAdjacentHTML('beforeend',`<div class="item"><strong>${p.name}</strong>${p.box?qty(p.id,'box','caixas'):''}${p.unit?qty(p.id,'unit','unidades'):''}</div>`)})});w.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const[id,t,d]=b.dataset.q.split(':');order[id][t]=Math.max(0,Math.min(999,order[id][t]+Number(d)));renderOrder()})}$('#reviewOrder').onclick=()=>Object.values(order).some(v=>v.box||v.unit)?go('review'):toast('Adicione ao menos um item');function build(){const supplier=suppliers.find(s=>String(s.id)===$('#supplierSelect').value)||suppliers[0],lines=['*PEDIDO DE CARNES — ITÁLIA SUPERMERCADO*','',`Fornecedor: ${supplier?.name||''}`,''],groups={};products.forEach(p=>{const q=order[p.id];if(q&&(q.box||q.unit))(groups[p.category]??=[]).push({p,q})});Object.entries(groups).forEach(([c,it])=>{lines.push(`*${c.toUpperCase()}*`);it.forEach(({p,q})=>{const a=[];if(q.box)a.push(`${q.box} caixa(s)`);if(q.unit)a.push(`${q.unit} unidade(s)`);lines.push(`• ${p.name}: ${a.join(' e ')}`)});lines.push('')});const r=$('#responsible').value.trim(),n=$('#notes').value.trim();if(r)lines.push(`Responsável: ${r}`);if(n)lines.push(`Observação: ${n}`);return{text:lines.join('\n'),supplier}}function renderReview(){$('#summaryText').textContent=build().text}$('#responsible').oninput=renderReview;$('#notes').oninput=renderReview;$('#openWhatsapp').onclick=()=>{const{text,supplier}=build(),phone=(supplier?.phone||'').replace(/\D/g,'');if(!phone)return toast('Fornecedor sem WhatsApp');location.href=`https://wa.me/55${phone}?text=${encodeURIComponent(text)}`};</script></body></html>
