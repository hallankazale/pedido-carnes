name: Corrigir revisão no iPhone

on:
  push:
    paths:
      - '.github/workflows/iphone-review-fix.yml'

permissions:
  contents: write

jobs:
  fix-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar revisão para iPhone
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          /* Revisão otimizada para iPhone e telas estreitas */
          #review{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
          #review .page-head{position:sticky;top:0;z-index:20;background:rgba(244,247,245,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:4px 0 9px;margin-top:0}
          #review .form{box-shadow:0 8px 24px rgba(23,32,51,.06)}
          #review .review-summary{padding:0;background:transparent;border:0;box-shadow:none;overflow:visible}
          #reviewCards{display:grid;gap:10px}
          .review-header{background:linear-gradient(135deg,#172033,#28364d);color:#fff;border-radius:18px;padding:15px 16px;box-shadow:0 10px 24px rgba(23,32,51,.16)}
          .review-header small{display:block;font-size:11px;opacity:.72;margin-bottom:4px}
          .review-header strong{display:block;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
          .review-category{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;box-shadow:var(--s)}
          .review-category-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #edf1ef}
          .review-category-title strong{font-size:14px;color:var(--g);letter-spacing:.2px}
          .review-category-title span{font-size:10px;font-weight:800;color:#687487;background:#f1f5f3;border-radius:999px;padding:5px 8px}
          .review-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f1}
          .review-line:last-child{border-bottom:0;padding-bottom:1px}
          .review-line-name{font-size:14px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}
          .review-line-qty{text-align:right;font-size:13px;font-weight:850;color:#344054;line-height:1.35;white-space:normal;max-width:46vw}
          .review-extra{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;box-shadow:var(--s)}
          .review-extra-row{margin-bottom:11px}
          .review-extra-row:last-child{margin-bottom:0}
          .review-extra-row small{display:block;color:var(--m);font-size:10.5px;font-weight:800;margin-bottom:3px}
          .review-extra-row div{font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
          .review-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),406px);display:grid!important;grid-template-columns:1fr 1.25fr;gap:9px;padding:9px;background:rgba(255,255,255,.94);border:1px solid rgba(220,228,223,.92);border-radius:18px;box-shadow:0 12px 34px rgba(23,32,51,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:45}
          .review-actions .btn{min-width:0;min-height:50px;padding:11px 8px;font-size:12px}
          @supports(-webkit-touch-callout:none){
            #review .input,#review textarea{font-size:16px}
            #review .review-line-name{font-size:15px}
            #review .review-line-qty{font-size:14px}
          }
          @media(max-width:360px){
            .review-line{grid-template-columns:1fr}
            .review-line-qty{text-align:left;max-width:none;color:var(--g)}
            .review-actions{width:calc(100% - 18px)}
          }
          '''

          if '/* Revisão otimizada para iPhone' not in html:
              html = html.replace('</style></head>', css + '</style></head>')

          old = '<div class="form"><pre id="summaryText"></pre></div><div class="row"><button id="saveDraft"'
          new = '<div class="form review-summary"><div id="reviewCards"></div><pre id="summaryText" hidden></pre></div><div class="row review-actions"><button id="saveDraft"'
          html = html.replace(old, new)

          old_js = "function renderReview(){summaryText.textContent=build().text}"
          new_js = r'''function escapeHtml(value){return String(value??'').replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]))}function renderReview(){const built=build();summaryText.textContent=built.text;const supplier=built.supplier;let totalLines=0;const categoryCards=categories.map(category=>{const items=products.filter(p=>p.category===category).filter(p=>currentOrder[p.id]&&Object.values(currentOrder[p.id]).some(v=>v>0));if(!items.length)return'';totalLines+=items.length;const rows=items.map(p=>{const quantities=Object.entries(currentOrder[p.id]).filter(([,v])=>v>0).map(([mode,value])=>`${value} ${mode.toLowerCase()}${value===1?'':'s'}`).join(' · ');return `<div class="review-line"><div class="review-line-name">${escapeHtml(p.name)}</div><div class="review-line-qty">${escapeHtml(quantities)}</div></div>`}).join('');return `<section class="review-category"><div class="review-category-title"><strong>${escapeHtml(category)}</strong><span>${items.length} ${items.length===1?'produto':'produtos'}</span></div>${rows}</section>`}).join('');const extras=[responsible.value.trim()?`<div class="review-extra-row"><small>RESPONSÁVEL</small><div>${escapeHtml(responsible.value.trim())}</div></div>`:'',notes.value.trim()?`<div class="review-extra-row"><small>OBSERVAÇÃO</small><div>${escapeHtml(notes.value.trim())}</div></div>`:''].join('');reviewCards.innerHTML=`<div class="review-header"><small>FORNECEDOR</small><strong>${escapeHtml(supplier?.name||'Não informado')}</strong></div>${categoryCards}${extras?`<div class="review-extra">${extras}</div>`:''}`;}'''
          html = html.replace(old_js, new_js)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Melhora revisão do pedido no iPhone'
          git push
