    <rect class="card" rx="16" x="30" y="492" width="320" height="82"/><text x="50" y="526" class="label dark">Frigorífico Pamplona</text><text x="50" y="555" class="small muted">47 99999-2222</text>
    <rect class="card" rx="16" x="30" y="586" width="320" height="82"/><text x="50" y="620" class="label dark">Distribuidora Master</text><text x="50" y="649" class="small muted">47 99999-3333</text>
    <text x="34" y="720" class="step muted">TELA 2 · FORNECEDORES</text>
