<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2100" viewBox="0 0 1440 2100">
  <defs>
    <style>
      .bg{fill:#F4F1EA}.phone{fill:#101418;stroke:#2B3035;stroke-width:4}.screen{fill:#F8F7F3}.card{fill:#FFFFFF;stroke:#DED9CF;stroke-width:2}.primary{fill:#8B1E2D}.secondary{fill:#F3E4E7;stroke:#8B1E2D;stroke-width:2}.muted{fill:#6A737C}.dark{fill:#1E272F}.white{fill:#FFFFFF}.green{fill:#1FA463}.line{stroke:#DED9CF;stroke-width:2}.title{font:800 34px Arial}.h2{font:800 25px Arial}.body{font:400 18px Arial}.small{font:400 15px Arial}.button{font:800 18px Arial}.label{font:700 16px Arial}.eyebrow{font:800 13px Arial;letter-spacing:2px}.qty{font:800 22px Arial}.step{font:800 14px Arial}.note{font:400 17px Arial}.shadow{filter:drop-shadow(0 12px 24px rgba(0,0,0,.16))}
    </style>
  </defs>
  <rect class="bg" width="1440" height="2100"/>
  <text x="80" y="72" class="title dark">Protótipo — Pedido de Carnes</text>
  <text x="80" y="108" class="body muted">Fluxo principal do aplicativo para Android e iOS</text>

  <!-- Phone 1 Home -->
  <g transform="translate(80 160)" class="shadow">
    <rect class="phone" rx="42" width="380" height="760"/>
    <rect class="screen" rx="34" x="12" y="12" width="356" height="736"/>
    <rect fill="#101418" rx="12" x="126" y="24" width="128" height="22"/>
    <text x="34" y="96" class="eyebrow muted">PEDIDOS DO AÇOUGUE</text>
    <text x="34" y="140" class="title dark">Pedido de Carnes</text>
    <text x="34" y="176" class="body muted">Rápido, offline e sem digitação repetitiva.</text>
    <rect class="primary" rx="16" x="30" y="210" width="320" height="62"/>
    <text x="104" y="250" class="button white">+ NOVO PEDIDO</text>
    <text x="34" y="322" class="h2 dark">Acesso rápido</text>
    <rect class="card" rx="18" x="30" y="346" width="320" height="96"/>
    <text x="54" y="382" class="h2 dark">Fornecedores</text><text x="54" y="416" class="small muted">3 cadastrados</text>
    <rect class="card" rx="18" x="30" y="458" width="320" height="96"/>
    <text x="54" y="494" class="h2 dark">Produtos</text><text x="54" y="528" class="small muted">18 carnes cadastradas</text>
    <rect class="secondary" rx="18" x="30" y="574" width="320" height="112"/>
    <text x="54" y="610" class="label" fill="#8B1E2D">FUNCIONA SEM INTERNET</text>
    <text x="54" y="642" class="small muted">Os dados ficam salvos no celular.</text>
    <text x="54" y="670" class="small muted">O WhatsApp envia quando houver conexão.</text>
    <text x="34" y="720" class="step muted">TELA 1 · INÍCIO</text>
  </g>

