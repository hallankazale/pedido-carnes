    <rect class="card" rx="14" x="30" y="196" width="320" height="58"/><text x="50" y="232" class="body muted">WhatsApp com DDD</text>
    <rect class="primary" rx="16" x="30" y="270" width="320" height="58"/><text x="112" y="307" class="button white">SALVAR</text>
