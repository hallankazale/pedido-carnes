    <rect class="card" rx="16" x="30" y="194" width="320" height="92"/><text x="48" y="229" class="label dark">Coxão mole</text><rect class="secondary" rx="10" x="184" y="214" width="42" height="42"/><text x="200" y="243" class="qty" fill="#8B1E2D">−</text><text x="244" y="243" class="qty dark">3</text><rect class="secondary" rx="10" x="282" y="214" width="42" height="42"/><text x="296" y="243" class="qty" fill="#8B1E2D">+</text><text x="48" y="261" class="small muted">caixas</text>
    <rect class="card" rx="16" x="30" y="298" width="320" height="92"/><text x="48" y="333" class="label dark">Contrafilé</text><rect class="secondary" rx="10" x="184" y="318" width="42" height="42"/><text x="200" y="347" class="qty" fill="#8B1E2D">−</text><text x="244" y="347" class="qty dark">2</text><rect class="secondary" rx="10" x="282" y="318" width="42" height="42"/><text x="296" y="347" class="qty" fill="#8B1E2D">+</text><text x="48" y="365" class="small muted">caixas</text>
    <text x="34" y="438" class="h2 dark">COSTELAS</text>
    <rect class="card" rx="16" x="30" y="454" width="320" height="92"/><text x="48" y="489" class="label dark">Costela janela</text><rect class="secondary" rx="10" x="184" y="474" width="42" height="42"/><text x="200" y="503" class="qty" fill="#8B1E2D">−</text><text x="244" y="503" class="qty dark">8</text><rect class="secondary" rx="10" x="282" y="474" width="42" height="42"/><text x="296" y="503" class="qty" fill="#8B1E2D">+</text><text x="48" y="521" class="small muted">unidades</text>
