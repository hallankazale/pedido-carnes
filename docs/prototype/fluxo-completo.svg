  <!-- Phone 6 Review -->
  <g transform="translate(980 1040)" class="shadow">
    <rect class="phone" rx="42" width="380" height="760"/><rect class="screen" rx="34" x="12" y="12" width="356" height="736"/><rect fill="#101418" rx="12" x="126" y="24" width="128" height="22"/>
