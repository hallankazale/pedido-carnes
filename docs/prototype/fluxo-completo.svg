    <rect class="card" rx="16" x="30" y="456" width="320" height="76"/><text x="50" y="487" class="label dark">Coxão mole</text><text x="50" y="516" class="small muted">Caixaria · Caixa</text>
    <rect class="card" rx="16" x="30" y="544" width="320" height="76"/><text x="50" y="575" class="label dark">Costela janela</text><text x="50" y="604" class="small muted">Costelas · Unidade</text>
    <rect class="card" rx="16" x="30" y="632" width="320" height="76"/><text x="50" y="663" class="label dark">Contrafilé</text><text x="50" y="692" class="small muted">Caixaria · Caixa e unidade</text>
    <text x="34" y="730" class="step muted">TELA 3 · PRODUTOS</text>
  </g>

  <!-- Phone 4 Supplier selection -->
