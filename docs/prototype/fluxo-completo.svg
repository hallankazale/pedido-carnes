    <text x="34" y="136" class="small muted">Frigorífico Central</text>
    <rect class="card" rx="18" x="30" y="158" width="320" height="204"/>
    <text x="50" y="194" class="label dark">CAIXARIA</text><text x="50" y="228" class="body dark">• 3 caixas de Coxão mole</text><text x="50" y="260" class="body dark">• 2 caixas de Contrafilé</text>
    <text x="50" y="304" class="label dark">COSTELAS</text><text x="50" y="338" class="body dark">• 8 unidades de Costela janela</text>
    <rect class="card" rx="14" x="30" y="380" width="320" height="56"/><text x="50" y="415" class="body muted">Responsável: João</text>
    <rect class="card" rx="14" x="30" y="448" width="320" height="90"/><text x="50" y="482" class="body muted">Observação</text><text x="50" y="514" class="small dark">Entregar amanhã antes das 8h.</text>
    <rect class="primary" rx="16" x="30" y="560" width="320" height="62"/><text x="82" y="600" class="button white">ENVIAR PELO WHATSAPP</text>
    <rect class="secondary" rx="16" x="30" y="636" width="320" height="52"/><text x="136" y="669" class="button" fill="#8B1E2D">EDITAR</text>
    <text x="34" y="720" class="step muted">TELA 6 · REVISÃO E ENVIO</text>
  </g>

  <text x="80" y="1950" class="h2 dark">Direção visual</text>
  <text x="80" y="1990" class="note muted">Botões grandes, contraste forte, poucos passos e operação rápida para ambiente de açougue.</text>
  <text x="80" y="2024" class="note muted">Paleta: vinho escuro, branco quente e cinza neutro. Layout responsivo para Android e iPhone.</text>
</svg>