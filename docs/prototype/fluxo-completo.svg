    <rect class="secondary" rx="18" x="30" y="164" width="320" height="94"/><circle cx="58" cy="211" r="10" fill="#8B1E2D"/><text x="84" y="202" class="label dark">Frigorífico Central</text><text x="84" y="230" class="small muted">47 99999-1111</text>
    <rect class="card" rx="18" x="30" y="274" width="320" height="94"/><circle cx="58" cy="321" r="10" fill="#FFFFFF" stroke="#9AA1A7" stroke-width="2"/><text x="84" y="312" class="label dark">Frigorífico Pamplona</text><text x="84" y="340" class="small muted">47 99999-2222</text>
    <rect class="card" rx="18" x="30" y="384" width="320" height="94"/><circle cx="58" cy="431" r="10" fill="#FFFFFF" stroke="#9AA1A7" stroke-width="2"/><text x="84" y="422" class="label dark">Distribuidora Master</text><text x="84" y="450" class="small muted">47 99999-3333</text>
    <rect class="primary" rx="16" x="30" y="626" width="320" height="62"/><text x="126" y="666" class="button white">CONTINUAR</text>
    <text x="34" y="720" class="step muted">TELA 4 · SELEÇÃO</text>
  </g>

  <!-- Phone 5 Order builder -->
  <g transform="translate(530 1040)" class="shadow">
    <rect class="phone" rx="42" width="380" height="760"/><rect class="screen" rx="34" x="12" y="12" width="356" height="736"/><rect fill="#101418" rx="12" x="126" y="24" width="128" height="22"/>
